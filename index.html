<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YATD — Yet Another Tower Defense</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #050705;
    overflow: hidden;
    font-family: "DejaVu Sans Mono", "Menlo", "Consolas", monospace;
  }
  #frame {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #crt {
    position: relative;
    width: min(96vw, calc(96vh * 2));
    aspect-ratio: 2 / 1;
    background: #020302;
    border-radius: 18px;
    box-shadow: 0 0 60px rgba(40,255,110,0.10), inset 0 0 120px rgba(0,0,0,0.85);
    overflow: hidden;
  }
  #screen {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    filter: drop-shadow(0 0 3px rgba(80,255,140,0.35)) contrast(1.05) brightness(1.02);
    cursor: crosshair;
  }
  .scanlines {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0)   0px,
      rgba(0,0,0,0)   2px,
      rgba(0,0,0,0.22) 3px
    );
    mix-blend-mode: multiply;
    animation: flicker 4s infinite steps(60);
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }
  @keyframes flicker {
    0%,100% { opacity: 1; }
    31%  { opacity: .96; }
    32%  { opacity: 1; }
    67%  { opacity: .97; }
    68%  { opacity: 1; }
  }
</style>
</head>
<body>
<div id="frame">
  <div id="crt">
    <canvas id="screen"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>
</div>
<script>
"use strict";
/* ================= YATD — Yet Another Tower Defense =================
   A NetHack-flavored ASCII tower defense. Everything lives in this file. */

/* ---------- terminal grid ---------- */
const COLS = 80, ROWS = 24;        // row 0: messages, 1..21: map, 22-23: status
const MAPW = 80, MAPH = 21, MAPY = 1;
const CW = 12, CH = 20;

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
let dpr = 1;
function fitCanvas() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = COLS * CW * dpr;
  canvas.height = ROWS * CH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = '16px "DejaVu Sans Mono", "Menlo", "Consolas", monospace';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
}
fitCanvas();
window.addEventListener("resize", fitCanvas);

// character buffer
const buf = [];
for (let y = 0; y < ROWS; y++) {
  buf.push([]);
  for (let x = 0; x < COLS; x++) buf[y].push({ ch: " ", fg: "#4a7a4a", bg: null });
}
function put(x, y, ch, fg, bg) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
  const c = buf[y][x];
  c.ch = ch; c.fg = fg; if (bg !== undefined) c.bg = bg;
}
function text(x, y, s, fg, bg) {
  for (let i = 0; i < s.length; i++) put(x + i, y, s[i], fg, bg);
}
function clearBuf() {
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = buf[y][x]; c.ch = " "; c.fg = "#4a7a4a"; c.bg = null;
  }
}
function blit() {
  ctx.fillStyle = "#030503";
  ctx.fillRect(0, 0, COLS * CW, ROWS * CH);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = buf[y][x];
    if (c.bg) {
      ctx.fillStyle = c.bg;
      ctx.fillRect(x * CW, y * CH, CW, CH);
    }
    if (c.ch !== " ") {
      ctx.fillStyle = c.fg;
      ctx.fillText(c.ch, x * CW + CW / 2, y * CH + CH / 2 + 1);
    }
  }
}

/* ---------- dungeon map (procedurally generated) ---------- */
// Every game carves a fresh dungeon: a serpentine corridor from < to >
// plus rooms scattered along it. ?seed=N in the URL replays a dungeon;
// the current seed is shown on the title screen.
function mulberry32(s) {
  return function () {
    let t = s += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const urlSeed = parseInt(new URLSearchParams(location.search).get("seed"), 10);
let seedUsed = false;
function newSeed() {
  if (!seedUsed && !isNaN(urlSeed)) { seedUsed = true; return urlSeed; }
  return Math.floor(Math.random() * 2 ** 31);
}
let SEED = 0, rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));

const map = [];            // MAPH x MAPW of glyphs; ' ' = solid rock
for (let y = 0; y < MAPH; y++) map.push(new Array(MAPW).fill(" "));
const path = [];           // ordered [x,y], the GENERATOR's seed route
const pathIdx = new Map(); // "x,y" -> index along path (generation only)
let ENTRANCE = [0, 0], EXIT = [0, 0];   // the '<' and '>' cells

// serpentine waypoints: x-columns strictly increase, so no self-crossing
function genPath() {
  const xs = [2];
  while (xs[xs.length - 1] < 62) xs.push(xs[xs.length - 1] + ri(9, 15));
  xs[xs.length - 1] = Math.min(xs[xs.length - 1], 73);
  xs.push(77);
  let down = rnd() < 0.5;
  let y = down ? ri(2, 5) : ri(14, 17);
  const wp = [[xs[0], y]];
  for (let i = 1; i < xs.length; i++) {
    wp.push([xs[i], y]);
    if (i < xs.length - 1) {
      y = down ? ri(14, 17) : ri(2, 5);
      down = !down;
      wp.push([xs[i], y]);
    }
  }
  return wp;
}
function pathCells(wp) {
  const cells = [[wp[0][0], wp[0][1]]];
  let [cx, cy] = wp[0];
  for (let i = 1; i < wp.length; i++) {
    const [tx, ty] = wp[i];
    const dx = Math.sign(tx - cx), dy = Math.sign(ty - cy);
    while (cx !== tx || cy !== ty) { cx += dx; cy += dy; cells.push([cx, cy]); }
  }
  return cells;
}
// rooms seeded on random path cells; rejected if too close to another room
function genRooms(cells) {
  const rooms = [];
  const clash = (r) => rooms.some(o =>
    r[0] - 2 <= o[2] && o[0] - 2 <= r[2] && r[1] - 2 <= o[3] && o[1] - 2 <= r[3]);
  let tries = 0;
  while (rooms.length < 8 && tries++ < 250) {
    const [cx, cy] = cells[ri(0, cells.length - 1)];
    const w = ri(5, 9), h = ri(3, 5);
    const x1 = Math.max(1, Math.min(77 - w, cx - ri(0, w)));
    const y1 = Math.max(1, Math.min(19 - h, cy - ri(0, h)));
    const r = [x1, y1, x1 + w, y1 + h];
    if (!clash(r)) rooms.push(r);
  }
  return rooms;
}
// carve one level into map/path/pathIdx; returns a quality score
// (buildable floor tiles within tower reach of the path)
function buildLevel() {
  for (let y = 0; y < MAPH; y++) map[y].fill(" ");
  path.length = 0; pathIdx.clear();
  const wp = genPath();
  const cells = pathCells(wp);
  for (const [x1, y1, x2, y2] of genRooms(cells)) {
    for (let y = y1 - 1; y <= y2 + 1; y++) for (let x = x1 - 1; x <= x2 + 1; x++) {
      if (y < 0 || x < 0 || y >= MAPH || x >= MAPW) continue;
      if (y === y1 - 1 || y === y2 + 1) map[y][x] = "-";
      else if (x === x1 - 1 || x === x2 + 1) map[y][x] = "|";
      else map[y][x] = ".";
    }
  }
  for (const [x, y] of cells) {
    const k = x + "," + y;
    if (!pathIdx.has(k)) { pathIdx.set(k, path.length); path.push([x, y]); }
    const g = map[y][x];
    if (g === " ") map[y][x] = "#";
    else if (g === "|" || g === "-") map[y][x] = "+";
  }
  ENTRANCE = [wp[0][0], wp[0][1]];
  EXIT = wp[wp.length - 1];
  map[ENTRANCE[1]][ENTRANCE[0]] = "<";
  map[EXIT[1]][EXIT[0]] = ">";
  let deco = 0, guard = 0;
  while (deco < 3 && guard++ < 200) {
    const x = ri(1, 78), y = ri(1, 19);
    if (map[y][x] === "." && !onPath(x, y)) { map[y][x] = "{"; deco++; }
  }
  let good = 0;
  for (let y = 0; y < MAPH; y++) for (let x = 0; x < MAPW; x++) {
    if (map[y][x] !== "." || onPath(x, y)) continue;
    if (path.some(([px, py]) => Math.hypot(px - x, py - y) <= 4.5)) good++;
  }
  return good;
}
function genLevel() {
  SEED = newSeed();
  for (let i = 0; i < 80; i++) {
    rnd = mulberry32(SEED + i);        // deterministic retries per seed
    if (buildLevel() >= 60 && path.length >= 135) return;
  }
}

// Bresenham line walk: true if nothing solid (rock/wall) stands between
// the two cells. Used so ranged towers can't shoot through walls into
// the next corridor over.
function hasLineOfSight(x0, y0, x1, y1) {
  let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0;
  while (x !== x1 || y !== y1) {
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
    if (x === x1 && y === y1) break;
    const g = map[y] && map[y][x];
    if (g === " " || g === "|" || g === "-") return false;
  }
  return true;
}
const onPath = (x, y) => pathIdx.has(x + "," + y);
// Any tile that isn't solid rock or a wall can be walked on -- rooms,
// corridors, doors, stairs, decorative fountains. Blocking towers carve
// extra obstacles out of this at runtime (see computeFlow below).
const terrainWalkable = (x, y) => {
  const g = map[y] && map[y][x];
  return g === "." || g === "#" || g === "+" || g === "<" || g === ">" || g === "{";
};
const buildable = (x, y) =>
  map[y] && map[y][x] === "." && !towerAt(x, y) &&
  // block placement under a creep's current cell AND the cell it's
  // already committed to stepping into (mid-transit), so a blocking
  // tower can never land exactly where a monster is about to arrive
  !G.creeps.some(c => !c.dead &&
    ((c.x === x && c.y === y) || (c.nx === x && c.ny === y)));
const trapPlaceable = (x, y) => {
  const g = map[y] && map[y][x];
  return (g === "#" || g === "+") && !towerAt(x, y);
};

// Monsters don't follow a fixed line -- every game tick they take the
// shortest currently-open route to the stairs, recomputed as a BFS flow
// field (dist-to-exit + which neighbor to step toward) whenever a
// blocking tower is built or sold. `extraBlocked` lets buildTower() do a
// dry-run check before committing to a placement. `ignoreTowerBlocks`
// computes the field flying monsters use -- they cut straight through
// any wall of towers, only rock/walls stop them (see G.flowFly).
function computeFlow(extraBlocked, ignoreTowerBlocks) {
  const dist = Array.from({ length: MAPH }, () => new Array(MAPW).fill(Infinity));
  const next = Array.from({ length: MAPH }, () => new Array(MAPW).fill(null));
  const blocked = new Set(ignoreTowerBlocks ? [] :
    G.towers.filter(t => TOWERS[t.type].blocks).map(t => t.x + "," + t.y));
  if (extraBlocked) for (const [ex, ey] of extraBlocked) blocked.add(ex + "," + ey);
  const passable = (x, y) =>
    x >= 0 && y >= 0 && x < MAPW && y < MAPH &&
    terrainWalkable(x, y) && !blocked.has(x + "," + y);
  const [ex, ey] = EXIT;
  if (!passable(ex, ey)) return { dist, next };
  dist[ey][ex] = 0;
  const q = [[ex, ey]];
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (let i = 0; i < q.length; i++) {
    const [cx, cy] = q[i];
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      if (!passable(nx, ny) || dist[ny][nx] <= dist[cy][cx] + 1) continue;
      dist[ny][nx] = dist[cy][cx] + 1;
      next[ny][nx] = [cx, cy];
      q.push([nx, ny]);
    }
  }
  return { dist, next };
}
// true if placing a blocking tower at (x,y) would cut off every route
// from the stairs down to the stairs up
function wouldSealPath(x, y) {
  const { dist } = computeFlow([[x, y]]);
  return !isFinite(dist[ENTRANCE[1]][ENTRANCE[0]]);
}

const TERRAIN_COLOR = {
  "-": "#9aa88a", "|": "#9aa88a", ".": "#3d6b3d", "#": "#6e6e5c",
  "+": "#c8a832", "<": "#e8e8d8", ">": "#e8e8d8", "{": "#4aa8ff", " ": "#000",
};

/* ---------- data tables ---------- */
// Tower glyphs deliberately avoid letters: in this game (as in NetHack)
// letters are reserved for monsters, so towers use NetHack object-class
// punctuation instead -- no ambiguity about what's a monster on the map.
// `blocks: true` towers physically occupy their tile -- monsters route
// around them (see computeFlow). The fire trap is flush with the floor
// and never blocks; monsters walk over it and trigger it on contact.
const TOWERS = {
  1: { ch: "/", name: "Wand of Striking", cost: 10, dmg: 5, range: 5.0, cd: 0.55,
       kind: "bolt", blocks: true, maxCharges: 25, fg: "#e8e850",
       desc: "cheap, quick bolts; runs low on charges, recharges slowly" },
  2: { ch: "0", name: "Acid Blob", cost: 25, dmg: 7, range: 4.0, cd: 1.2,
       kind: "splash", blocks: true, splash: 1.6, fg: "#50e850",
       desc: "lobs acid; splash damage" },
  3: { ch: "{", name: "Frost Fountain", cost: 20, dmg: 2, range: 3.5, cd: 0.7,
       kind: "slow", blocks: true, slow: 0.5, slowDur: 2.0, fg: "#50c8e8",
       desc: "chills and slows nearby monsters" },
  4: { ch: "^", name: "Fire Trap", cost: 15, dmg: 14, range: 0, cd: 0.5,
       kind: "trap", blocks: false, fg: "#e85050",
       desc: "burns monsters standing on it (place ON the corridor)" },
};
const UPG_MULT = 1.6, UPG_RANGE = 0.5, MAX_LVL = 4;
const upgradeCost = (t) => TOWERS[t.type].cost * (t.lvl + 1);

// `flies: true` ignores every blocking tower (only rock/walls stop it --
// see G.flowFly/creepFlow) -- the counter to a turtled tower maze.
// `splits`: on death, a chance to spawn a weaker copy of itself
// (`child: true` on the spawned copy stops it from splitting again).
// `submerges`: periodically untargetable by every damage source except
// the fireball scroll (see isSubmerged()).
const MONSTERS = {
  r: { name: "sewer rat", hp: 9,   spd: 3.4, bounty: 2,  leak: 1,  fg: "#b8825a" },
  x: { name: "grid bug",  hp: 5,   spd: 3.6, bounty: 1,  leak: 1,  fg: "#c8c850" },
  a: { name: "giant ant", hp: 8,   spd: 4.0, bounty: 1,  leak: 1,  fg: "#d0d050" },
  b: { name: "cave bat",  hp: 10,  spd: 4.5, bounty: 3,  leak: 1,  fg: "#a050e8", flies: true },
  k: { name: "kobold",    hp: 18,  spd: 2.2, bounty: 3,  leak: 1,  fg: "#e85050" },
  ";": { name: "giant eel", hp: 30, spd: 2.0, bounty: 5, leak: 2,  fg: "#50a8e8", submerges: true },
  o: { name: "orc",       hp: 42,  spd: 1.8, bounty: 5,  leak: 2,  fg: "#e8a050" },
  "&": { name: "demon",   hp: 55,  spd: 1.7, bounty: 9,  leak: 2,  fg: "#e850e8",
         splits: true, splitChance: 0.5, splitHpFrac: 0.4 },
  Z: { name: "zombie",    hp: 85,  spd: 1.1, bounty: 8,  leak: 2,  fg: "#a8b8a8" },
  T: { name: "troll",     hp: 150, spd: 1.6, bounty: 15, leak: 3,  fg: "#50b8b8", regen: 3 },
  D: { name: "red dragon",hp: 2200, spd: 0.9, bounty: 150,leak: 20, fg: "#ff5050", boss: true },
};
// waves: groups of {t: type, n: count, gap: seconds between spawns}.
// Regenerated on every new level (Dlvl) by genWaves(dlvl): every wave
// gets a point budget (growing ~1.5x per wave, +-15%, and ~1.3x per
// Dlvl) spent on monster types that unlock as waves go on. Wave 10
// always ends with the dragon.
const WAVES = [];
function genWaves(dlvl) {
  WAVES.length = 0;
  const dlvlMul = Math.pow(1.3, (dlvl || 1) - 1);
  const pool = [
    { t: "r", cost: 1,  gap: 0.7,  min: 1 },
    { t: "x", cost: 1,  gap: 0.3,  min: 1 },
    { t: "a", cost: 1,  gap: 0.35, min: 2 },
    { t: "b", cost: 2,  gap: 0.5,  min: 2 },
    { t: "k", cost: 2,  gap: 0.7,  min: 2 },
    { t: "o", cost: 5,  gap: 0.9,  min: 3 },
    { t: ";", cost: 4,  gap: 0.8,  min: 3 },
    { t: "&", cost: 6,  gap: 1.0,  min: 4 },
    { t: "Z", cost: 8,  gap: 1.0,  min: 5 },
    { t: "T", cost: 16, gap: 1.5,  min: 7 },
  ];
  for (let w = 1; w <= 10; w++) {
    const budget = (w === 10 ? 55 : 8 * Math.pow(1.5, w - 1)) * dlvlMul * (0.85 + rnd() * 0.3);
    const avail = pool.filter(p => w >= p.min);
    const nTypes = Math.min(avail.length, w < 3 ? ri(1, 2) : ri(2, 3));
    const chosen = [];
    let guard = 0;
    while (chosen.length < nTypes && guard++ < 50) {
      const p = avail[ri(0, avail.length - 1)];
      if (!chosen.includes(p)) chosen.push(p);
    }
    const groups = chosen.map(p => ({
      t: p.t, n: Math.max(1, Math.round(budget / nTypes / p.cost)), gap: p.gap,
    }));
    if (w === 10) groups.push({ t: "D", n: 1, gap: 1 });
    WAVES.push(groups);
  }
}
const waveHpScale = (w, dlvl) =>
  (1 + 0.22 * (w - 1)) * Math.pow(1.15, (dlvl || 1) - 1);
// true if a submerging monster is currently underwater and safe from
// everything except the fireball scroll
function isSubmerged(c) {
  const m = MONSTERS[c.type];
  return !!m.submerges && ((G.time + c.subPhase) % 4) < 1.5;
}

const MAX_DLVL = 5;   // clearing wave 10 here brings the real dragon fight

// generate the first dungeon now (title screen shows it); resetGame
// reuses it for the first game, then regenerates for every game after
let levelFresh = true;
genLevel();
genWaves(1);

/* ---------- game state ---------- */
const G = {
  state: "title",          // title | build | wave | won | lost
  gold: 40, hp: 20, maxHp: 20, dlvl: 1,
  wave: 0, score: 0, kills: 0,
  towers: [], creeps: [], fx: [], flow: null, flowFly: null,
  spawnQueue: [], spawnTimer: 0,
  selType: 0, selTower: null,          // 0 = no tool readied
  cursor: { x: 40, y: 10, on: false },
  hover: { x: -1, y: -1 },
  speed: 1, autoStart: false, overlay: null, paused: false,
  inv: { scroll: 0, potion: 0, wand: 0 }, hasteUntil: 0, seed: 0,
  msg: "Welcome to YATD!  Press ? for help.", msgAge: 0, log: [],
  time: 0,
};
window.G = G; // test hook

function towerAt(x, y) { return G.towers.find(t => t.x === x && t.y === y); }
function message(s) {
  G.msg = s; G.msgAge = 0;
  G.log.push(s);
  if (G.log.length > 300) G.log.shift();
}

function resetGame() {
  G.dlvl = 1;
  if (levelFresh) levelFresh = false;      // keep the title-screen dungeon
  else { genLevel(); genWaves(G.dlvl); }   // every later game is a new one
  G.seed = SEED;
  G.inv = { scroll: 0, potion: 0, wand: 0 }; G.hasteUntil = 0;
  G.state = "build"; G.gold = 40; G.hp = 20; G.wave = 0;
  G.score = 0; G.kills = 0;
  G.towers = []; G.creeps = []; G.fx = []; G.log = [];
  G.spawnQueue = []; G.selTower = null; G.selType = 0;
  G.speed = 1; G.autoStart = false; G.overlay = null; G.paused = false;
  G.flow = computeFlow();          // no towers on a fresh level, but keeps shape consistent
  G.flowFly = computeFlow(null, true); // static per level -- only walls/rock stop flyers
  message("You enter the Dungeons of Doom.  Build towers, then press SPACE.");
}

// clearing wave 10 on a level below MAX_DLVL brings a fresh dungeon and
// a harder wave set instead of ending the game; gold, score, and HP
// (with a small stairwell heal) carry over, towers do not -- it's a new
// map, rebuild your maze
function descend() {
  G.dlvl++;
  genLevel();
  genWaves(G.dlvl);
  G.wave = 0;
  G.towers = []; G.creeps = []; G.fx = [];
  G.spawnQueue = []; G.selTower = null; G.selType = 0;
  G.hp = Math.min(G.maxHp, G.hp + Math.round(G.maxHp * 0.25));
  G.flow = computeFlow();
  G.flowFly = computeFlow(null, true);
  G.state = "build";
  message("You descend to Dlvl " + G.dlvl +
    "...  the air grows colder and the dark feels less empty.");
}

function startWave() {
  if (G.state !== "build" || G.wave >= WAVES.length) return;
  G.wave++;
  G.state = "wave";
  G.spawnQueue = [];
  let delay = 0.5;
  for (const grp of WAVES[G.wave - 1]) {
    for (let i = 0; i < grp.n; i++) {
      G.spawnQueue.push({ at: delay, t: grp.t });
      delay += grp.gap;
    }
    delay += 1.5;
  }
  G.spawnTimer = 0;
  const boss = WAVES[G.wave - 1].some(g => MONSTERS[g.t].boss);
  message(boss
    ? "You feel a draft... something HUGE stirs on the up staircase!"
    : "Wave " + G.wave + " pours in from the up staircase...");
}

// which flow field a creep uses: flyers cut straight through any wall
// of towers (only rock/walls stop them), everything else routes around
const creepFlow = (c) => MONSTERS[c.type].flies ? G.flowFly : G.flow;
// point a creep at its next step toward the exit, per its flow field;
// null next means it's already standing on the exit cell
function advanceTarget(c) {
  const step = creepFlow(c).next[c.y][c.x];
  c.nx = step ? step[0] : c.x;
  c.ny = step ? step[1] : c.y;
}
function spawnCreep(type) {
  const m = MONSTERS[type];
  // boss HP is flat across waves within a level (a short random path
  // must not make wave 10 unwinnable), but still grows with depth
  const scale = m.boss ? Math.pow(1.15, G.dlvl - 1) : waveHpScale(G.wave, G.dlvl);
  const [sx, sy] = ENTRANCE;
  const c = {
    type, x: sx, y: sy, nx: sx, ny: sy, t: 0,
    hp: Math.round(m.hp * scale),
    maxHp: Math.round(m.hp * scale),
    spd: m.spd * (0.85 + rnd() * 0.3),   // don't all march in lockstep
    jit: ri(-1, 1),                      // a persistent lane, +-1 cell
    subPhase: rnd() * 4,                 // submerge cycle offset (eels)
    slowUntil: 0, hitFlash: 0,
  };
  advanceTarget(c);
  G.creeps.push(c);
}
// a creep's cell: no fixed path -- monsters route live around towers
// (see computeFlow/advanceTarget) -- but while crossing a room (never in
// 1-wide corridors, so trap alignment stays exact) they drift into their
// assigned lane so they don't all march single-file
function creepCell(c) {
  const { x, y } = c;
  if (!c.jit || map[y][x] !== ".") return [x, y];
  const px = -Math.sign(c.ny - y), py = Math.sign(c.nx - x);
  const vx = x + px * c.jit, vy = y + py * c.jit;
  if (map[vy] && map[vy][vx] === ".") return [vx, vy];
  return [x, y];
}
// how far a creep is from the exit (flow-field distance minus its
// progress toward the next cell) -- lower is closer, used to prioritize
// tower targeting the way "furthest along the path" did on a fixed route
function creepProgress(c) {
  const dist = creepFlow(c).dist;
  const d = dist[c.y] && dist[c.y][c.x];
  return (d === undefined ? Infinity : d) - c.t;
}

function buildTower(type, x, y) {
  const spec = TOWERS[type];
  const ok = spec.kind === "trap" ? trapPlaceable(x, y) : buildable(x, y);
  if (!ok) {
    message(spec.kind === "trap"
      ? "Traps only work laid across open corridor or a doorway."
      : "You cannot build there.");
    return false;
  }
  if (spec.blocks && wouldSealPath(x, y)) {
    message("A ward stops you -- that would seal the stairs completely.");
    return false;
  }
  if (G.gold < spec.cost) { message("You cannot afford that. (" + spec.cost + " zorkmids)"); return false; }
  G.gold -= spec.cost;
  const t = { type, x, y, lvl: 1, cd: 0, spent: spec.cost };
  if (spec.maxCharges) t.charges = spec.maxCharges;
  G.towers.push(t);
  if (spec.blocks) G.flow = computeFlow();
  message("You conjure a " + spec.name + ".");
  return true;
}
function upgradeTower(t) {
  if (!t) return;
  if (t.lvl >= MAX_LVL) { message("It is already fully enchanted."); return; }
  const cost = upgradeCost(t);
  if (G.gold < cost) { message("Enchanting costs " + cost + " zorkmids; you are short."); return; }
  G.gold -= cost; t.spent += cost; t.lvl++;
  if (TOWERS[t.type].maxCharges) t.charges = towerMaxCharges(t);  // enchanting refills it
  message("Your " + TOWERS[t.type].name + " glows brightly! (level " + t.lvl + ")");
}
function sellTower(t) {
  if (!t) return;
  const refund = Math.floor(t.spent * 0.7);
  G.gold += refund;
  G.towers = G.towers.filter(x => x !== t);
  if (G.selTower === t) G.selTower = null;
  if (TOWERS[t.type].blocks) G.flow = computeFlow();
  message("You dismantle the " + TOWERS[t.type].name + " for " + refund + " zorkmids.");
}
const towerDmg = (t) => Math.round(TOWERS[t.type].dmg * Math.pow(UPG_MULT, t.lvl - 1));
const towerRange = (t) => TOWERS[t.type].range + UPG_RANGE * (t.lvl - 1);
const towerMaxCharges = (t) =>
  Math.round(TOWERS[t.type].maxCharges * Math.pow(1.5, t.lvl - 1));
const CHARGE_REGEN = 0.4;   // charges/sec -- ~1 every 2.5s while below max

/* ---------- combat ---------- */
function damageCreep(c, dmg) {
  c.hp -= dmg; c.hitFlash = 0.1;
  if (c.hp <= 0 && !c.dead) {
    c.dead = true;
    const m = MONSTERS[c.type];
    G.gold += m.bounty; G.kills++; G.score += m.bounty * 10;
    if (m.boss) message("The " + m.name + " is destroyed!  You feel a surge of triumph! (+" + m.bounty + " zorkmids)");
    else message("The " + m.name + " is destroyed. (+" + m.bounty + " zorkmids)");
    if (!m.boss && rnd() < 0.08) dropItem();
    if (m.splits && !c.child && rnd() < m.splitChance) spawnChild(c, m);
  }
}
// a lesser copy that claws free of a split monster's corpse -- carries
// child:true so it can't chain-split itself
function spawnChild(parent, m) {
  const child = {
    type: parent.type, x: parent.x, y: parent.y, nx: parent.x, ny: parent.y, t: 0,
    hp: Math.max(1, Math.round(parent.maxHp * m.splitHpFrac)),
    maxHp: Math.max(1, Math.round(parent.maxHp * m.splitHpFrac)),
    spd: parent.spd, jit: ri(-1, 1), subPhase: rnd() * 4,
    slowUntil: 0, hitFlash: 0, child: true,
  };
  advanceTarget(child);
  G.creeps.push(child);
  message("A lesser " + m.name + " claws free!");
}

/* ---------- items (random drops from kills) ---------- */
function dropItem() {
  const roll = rnd();
  if (roll < 0.4) {
    const g = 5 + G.wave * 2;
    G.gold += g;
    message("You find a small pile of zorkmids! (+" + g + ")");
  } else if (roll < 0.65) {
    G.inv.scroll++;
    message("You find a scroll labeled ELBIB YLOH!  [r]ead it for fiery doom.");
  } else if (roll < 0.85) {
    G.inv.potion++;
    message("You find a fizzy potion!  [q]uaff to hasten your towers.");
  } else {
    G.inv.wand++;
    message("You find a wand of cold!  [z]ap it to chill every monster.");
  }
}
function useScroll() {
  if (G.inv.scroll < 1) { message("You have no scrolls to read."); return; }
  G.inv.scroll--;
  for (const c of [...G.creeps]) {
    if (c.dead) continue;
    const [x, y] = creepCell(c);
    splashFx(x, y, "#ff8850");
    damageCreep(c, 45);
  }
  message("You read the scroll.  A pillar of flame scours the dungeon!");
}
function usePotion() {
  if (G.inv.potion < 1) { message("You have no potions to quaff."); return; }
  G.inv.potion--;
  G.hasteUntil = G.time + 8;
  message("Gulp.  Your towers hum with supernatural speed! (8s)");
}
function useWand() {
  if (G.inv.wand < 1) { message("You have no wands to zap."); return; }
  G.inv.wand--;
  for (const c of G.creeps) {
    if (c.dead) continue;
    c.slowUntil = G.time + 4; c.slowFactor = 0.4;
  }
  message("You zap the wand of cold.  Every monster shivers and slows!");
}
function beamFx(x1, y1, x2, y2, fg) {
  const dx = x2 - x1, dy = y2 - y1;
  const n = Math.max(Math.abs(dx), Math.abs(dy));
  const ch = dx === 0 ? "|" : dy === 0 ? "-" : (dx > 0) === (dy > 0) ? "\\" : "/";
  const cells = [];
  for (let i = 1; i < n; i++)
    cells.push([Math.round(x1 + dx * i / n), Math.round(y1 + dy * i / n)]);
  G.fx.push({ cells, ch, fg, ttl: 0.08 });
}
function splashFx(x, y, fg) {
  const cells = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
    cells.push([x + dx, y + dy]);
  G.fx.push({ cells, ch: "*", fg, ttl: 0.12 });
}

function updateTowers(dt) {
  const hasteMul = G.time < G.hasteUntil ? 0.5 : 1;   // potion of haste
  for (const t of G.towers) {
    const spec = TOWERS[t.type];
    if (spec.maxCharges) {
      const max = towerMaxCharges(t);
      if (t.charges < max) t.charges = Math.min(max, t.charges + CHARGE_REGEN * dt);
    }
    t.cd -= dt;
    if (t.cd > 0) continue;
    const dmg = towerDmg(t), range = towerRange(t);
    if (spec.kind === "trap") {
      const victims = G.creeps.filter(c => {
        const [x, y] = creepCell(c);
        return !c.dead && !isSubmerged(c) && x === t.x && y === t.y;
      });
      if (victims.length) {
        for (const c of victims) damageCreep(c, dmg);
        splashFx(t.x, t.y, spec.fg);
        t.cd = spec.cd * hasteMul;
      }
      continue;
    }
    // pick target(s) furthest along (closest to the exit) within range and LOS
    let targets = G.creeps.filter(c => {
      if (c.dead || isSubmerged(c)) return false;
      const [x, y] = creepCell(c);
      return Math.hypot(x - t.x, y - t.y) <= range && hasLineOfSight(t.x, t.y, x, y);
    }).sort((a, b) => creepProgress(a) - creepProgress(b));
    if (!targets.length) continue;
    if (spec.kind === "slow") {
      let hit = false;
      for (const c of targets) {
        c.slowUntil = G.time + spec.slowDur; c.slowFactor = spec.slow;
        damageCreep(c, dmg); hit = true;
      }
      if (hit) {
        const [x, y] = creepCell(targets[0]);
        beamFx(t.x, t.y, x, y, spec.fg);
        t.cd = spec.cd * hasteMul;
      }
    } else if (spec.kind === "splash") {
      const c0 = targets[0];
      const [cx, cy] = creepCell(c0);
      for (const c of G.creeps) {
        if (c.dead || isSubmerged(c)) continue;
        const [x, y] = creepCell(c);
        if (Math.hypot(x - cx, y - cy) <= spec.splash &&
            hasLineOfSight(cx, cy, x, y)) damageCreep(c, dmg);
      }
      splashFx(cx, cy, spec.fg);
      t.cd = spec.cd * hasteMul;
    } else { // bolt
      if (spec.maxCharges && Math.floor(t.charges) < 1) continue; // out of charges
      if (spec.maxCharges) t.charges--;
      damageCreep(targets[0], dmg);
      const [x, y] = creepCell(targets[0]);
      beamFx(t.x, t.y, x, y, spec.fg);
      t.cd = spec.cd * hasteMul;
    }
  }
}

function updateCreeps(dt) {
  const [ex, ey] = EXIT;
  for (const c of G.creeps) {
    if (c.dead) continue;
    const m = MONSTERS[c.type];
    if (m.regen && c.hp < c.maxHp) c.hp = Math.min(c.maxHp, c.hp + m.regen * dt);
    c.hitFlash = Math.max(0, c.hitFlash - dt);
    let spd = c.spd;
    if (G.time < c.slowUntil) spd *= c.slowFactor;
    c.t += spd * dt;
    // consume whole-cell steps; a while loop lets fast creeps or high
    // game speed cross several cells in one update without stalling
    while (c.t >= 1 && !c.dead) {
      c.t -= 1;
      c.x = c.nx; c.y = c.ny;
      if (c.x === ex && c.y === ey) {
        c.dead = true; c.leaked = true;
        G.hp -= m.leak;
        message("The " + m.name + " descends the stairs!  You lose " + m.leak + " HP.");
        if (G.hp <= 0) { G.hp = 0; G.state = "lost"; }
        break;
      }
      advanceTarget(c);
      if (c.nx === c.x && c.ny === c.y) { c.t = 0; break; } // no route -- wait in place
    }
  }
  G.creeps = G.creeps.filter(c => !c.dead);
}

function update(dt) {
  if (G.paused) return;
  G.time += dt;
  G.msgAge += dt;
  for (const f of G.fx) f.ttl -= dt;
  G.fx = G.fx.filter(f => f.ttl > 0);

  if (G.state !== "wave") return;

  // spawning
  G.spawnTimer += dt;
  while (G.spawnQueue.length && G.spawnQueue[0].at <= G.spawnTimer) {
    spawnCreep(G.spawnQueue.shift().t);
  }
  updateTowers(dt);
  updateCreeps(dt);

  if (G.state === "wave" && !G.spawnQueue.length && !G.creeps.length) {
    // wave cleared
    const bonus = 10 + G.wave * 2;
    G.gold += bonus; G.score += 100 * G.wave * G.dlvl;
    if (G.wave >= WAVES.length) {
      if (G.dlvl >= MAX_DLVL) {
        G.state = "won";
        G.score += G.hp * 50;
      } else {
        descend();
        if (G.autoStart) startWave();
      }
    } else {
      G.state = "build";
      message("The dungeon falls silent.  Wave bonus: " + bonus + " zorkmids." +
        (G.autoStart ? "" : "  SPACE for wave " + (G.wave + 1) + "."));
      if (G.autoStart) startWave();
    }
  }
}

/* ---------- rendering ---------- */
function drawMap() {
  for (let y = 0; y < MAPH; y++) for (let x = 0; x < MAPW; x++) {
    const g = map[y][x];
    if (g !== " ") put(x, MAPY + y, g, TERRAIN_COLOR[g]);
  }
}
function drawRange(cx, cy, range, tint) {
  if (range <= 0) return;
  for (let y = 0; y < MAPH; y++) for (let x = 0; x < MAPW; x++) {
    if (map[y][x] === " ") continue;
    if (Math.hypot(x - cx, y - cy) <= range) buf[MAPY + y][x].bg = tint;
  }
}
function drawGame() {
  clearBuf();
  drawMap();

  // range preview: selected tower, or placement preview at hover/cursor
  const hx = G.cursor.on ? G.cursor.x : G.hover.x;
  const hy = G.cursor.on ? G.cursor.y : G.hover.y;
  if (G.selTower) {
    drawRange(G.selTower.x, G.selTower.y, towerRange(G.selTower), "#12241a");
  } else if (G.selType && hy >= 0 && hy < MAPH) {
    const spec = TOWERS[G.selType];
    const ok = spec.kind === "trap" ? trapPlaceable(hx, hy) : buildable(hx, hy);
    if (ok) drawRange(hx, hy, spec.range, "#12241a");
  }

  for (const t of G.towers) {
    const spec = TOWERS[t.type];
    const empty = spec.maxCharges && Math.floor(t.charges) < 1;
    const bright = ["", "", "#ffffff", "#ffd0ff", "#ffb000"][t.lvl] || spec.fg;
    const fg = empty ? "#4a4a3a" : (t.lvl === 1 ? spec.fg : bright);
    put(t.x, MAPY + t.y, spec.ch, fg, t === G.selTower ? "#243024" : undefined);
  }
  for (const c of G.creeps) {
    const [x, y] = creepCell(c);
    const m = MONSTERS[c.type];
    const fg = c.hitFlash > 0 ? "#ffffff" : (isSubmerged(c) ? "#2a4a5a" : m.fg);
    put(x, MAPY + y, c.type, fg);
  }
  for (const f of G.fx)
    for (const [x, y] of f.cells)
      if (y >= 0 && y < MAPH && map[y][x] !== " ") put(x, MAPY + y, f.ch, f.fg);

  // keyboard cursor
  if (G.cursor.on) {
    const cell = buf[MAPY + G.cursor.y][G.cursor.x];
    cell.bg = "#3a4a3a";
  }

  // message line
  const fade = G.msgAge > 6 ? "#4a6a4a" : "#d8e8c8";
  text(0, 0, G.msg.slice(0, COLS), fade);

  // status lines
  const spd = G.speed > 1 ? "  x" + G.speed : "";
  const auto = (G.autoStart ? "  [auto]" : "") +
               (G.time < G.hasteUntil ? "  [haste]" : "");
  text(0, 22,
    ("Dlvl:" + G.dlvl + "  $:" + G.gold + "  HP:" + G.hp + "(" + G.maxHp + ")  Wave:" +
     G.wave + "/" + WAVES.length + "  Kills:" + G.kills + "  Score:" + G.score +
     spd + auto).padEnd(COLS).slice(0, COLS), "#c8d8b8");
  if (G.paused) {
    const paused = "*** PAUSED ***";
    text(COLS - paused.length, 22, paused, "#ffe850");
  }

  const spaceHint = G.state === "wave"
    ? (G.paused ? "SPACE:resume" : "SPACE:pause")
    : "SPACE:start wave";
  let l2;
  if (G.selTower) {
    const t = G.selTower, spec = TOWERS[t.type];
    l2 = spec.ch + " " + spec.name + " L" + t.lvl + "  dmg:" + towerDmg(t) +
      "  rng:" + towerRange(t).toFixed(1) +
      (spec.maxCharges ? "  chg:" + Math.floor(t.charges) + "/" + towerMaxCharges(t) : "") +
      (t.lvl < MAX_LVL ? "  [u]pgrade $" + upgradeCost(t) : "  (max)") +
      "  [s]ell $" + Math.floor(t.spent * 0.7) + "  ESC";
  } else {
    l2 = G.selType
      ? "Readied: " + TOWERS[G.selType].ch + " " + TOWERS[G.selType].name + "  place it!"
      : "1:/$10 2:0$25 3:{$20 4:^$15 (ready a tower)";
    l2 += "  " + spaceHint + " i:inv ?:help";
    // hovered monster info
    if (hy >= 0 && hy < MAPH) {
      const c = G.creeps.find(c => {
        const [x, y] = creepCell(c); return x === hx && y === hy;
      });
      if (c) l2 = "You see: " + MONSTERS[c.type].name + "  HP:" +
        Math.ceil(c.hp) + "/" + c.maxHp + (G.time < c.slowUntil ? " (chilled)" : "");
    }
  }
  text(0, 23, l2.padEnd(COLS).slice(0, COLS), "#8aa87a");

  if (G.overlay === "help") drawHelp();
  else if (G.overlay === "inv") drawInventory();
  else if (G.overlay === "log") drawLog();
}

function drawLost() {
  clearBuf();
  const dtext = "Dlvl " + G.dlvl + ", wave " + G.wave;
  const padL = Math.floor(Math.max(0, 18 - dtext.length) / 2);
  const padR = Math.max(0, 18 - dtext.length) - padL;
  drawCentered([
    "               ----------",
    "              /          \\",
    "             /    REST    \\",
    "            /      IN      \\",
    "           /     PEACE      \\",
    "          /                  \\",
    "          |     the Keeper   |",
    "          |    " + String(G.score).padStart(6) + " points   |",
    "          |   overrun by a   |",
    "          |   monster horde  |",
    "          |" + " ".repeat(padL) + dtext + " ".repeat(padR) + "|",
    "         *|     *  *  *      | *",
    " ________)/\\\\_//(\\/(/\\)/\\//\\/|_)_______",
  ], 3, "#a8b8a8");
  drawCentered(["Do you want your possessions identified? [ynq]  (q, obviously)"], 18, "#c8d8b8");
  drawCentered(["-- press R to try again --"], 20, "#e8e850");
}

/* ---------- input ---------- */
function cellFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  // clamp: a click on the exact right/bottom edge pixel can compute to
  // COLS/ROWS (one past the last valid index) and silently miss
  const x = Math.min(COLS - 1, Math.max(0, Math.floor((e.clientX - r.left) / r.width * COLS)));
  const y = Math.min(ROWS - 1, Math.max(0, Math.floor((e.clientY - r.top) / r.height * ROWS)));
  return [x, y - MAPY];
}
canvas.addEventListener("mousemove", (e) => {
  const [x, y] = cellFromEvent(e);
  G.hover.x = x; G.hover.y = y; G.cursor.on = false;
});
canvas.addEventListener("mousedown", (e) => {
  if (G.state === "title") { resetGame(); return; }
  if (G.state === "won" || G.state === "lost") return;
  const [x, y] = cellFromEvent(e);
  G.hover.x = x; G.hover.y = y;   // keep the range-preview in sync with the click
  if (y < 0 || y >= MAPH) return;
  activate(x, y);
});
function activate(x, y) {
  if (G.overlay) { G.overlay = null; return; }
  const t = towerAt(x, y);
  if (t) { G.selTower = t; return; }
  G.selTower = null;
  if (!G.selType) { message("Ready a tower first: press 1, 2, 3, or 4."); return; }
  if (buildTower(G.selType, x, y)) G.selType = 0; // reselect before next placement
}

const DIRS = {
  h: [-1, 0], j: [0, 1], k: [0, -1], l: [1, 0],
  ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1], ArrowRight: [1, 0],
  y: [-1, -1], u2: [1, -1], b: [-1, 1], n: [1, 1],
};
window.addEventListener("keydown", (e) => {
  if (e.key === " ") e.preventDefault();
  if (G.state === "title") { resetGame(); return; }
  if (G.state === "won" || G.state === "lost") {
    if (e.key === "r" || e.key === "R") resetGame();
    return;
  }
  // overlays (help / inventory / message log) toggle regardless of state,
  // and swallow every other key while one is open
  if (e.key === "?") { G.overlay = G.overlay === "help" ? null : "help"; return; }
  if (e.key === "i") { G.overlay = G.overlay === "inv" ? null : "inv"; return; }
  if (e.ctrlKey && e.key.toLowerCase() === "p") {
    e.preventDefault();
    G.overlay = G.overlay === "log" ? null : "log";
    return;
  }
  if (G.overlay) { if (e.key === "Escape") G.overlay = null; return; }

  if (e.key >= "1" && e.key <= "4") {
    G.selType = +e.key; G.selTower = null;
    message("Ready: " + TOWERS[G.selType].name + " ($" + TOWERS[G.selType].cost + ") — " + TOWERS[G.selType].desc);
    return;
  }
  switch (e.key) {
    case " ":
      if (G.state === "build") { startWave(); return; }
      if (G.state === "wave") {
        G.paused = !G.paused;
        message(G.paused ? "Time stands still.  (SPACE to resume)" : "Time flows once more.");
      }
      return;
    case "a": G.autoStart = !G.autoStart;
      message("Auto-start waves: " + (G.autoStart ? "on" : "off")); return;
    case "+": case "=": G.speed = Math.min(4, G.speed * 2);
      message("Game speed x" + G.speed); return;
    case "-": G.speed = Math.max(1, G.speed / 2);
      message("Game speed x" + G.speed); return;
    case "u": if (G.selTower) { upgradeTower(G.selTower); return; } break;
    case "s": if (G.selTower) { sellTower(G.selTower); return; } break;
    case "r": useScroll(); return;
    case "q": usePotion(); return;
    case "z": useWand(); return;
    case "R": resetGame(); return;
    case "Escape": G.selTower = null; G.selType = 0; return;
    case "Enter":
      if (G.cursor.on) activate(G.cursor.x, G.cursor.y);
      return;
  }
  const d = DIRS[e.key];
  if (d) {
    if (!G.cursor.on) {
      G.cursor.on = true;
      if (G.hover.y >= 0 && G.hover.y < MAPH) {
        G.cursor.x = G.hover.x; G.cursor.y = G.hover.y;
      }
    } else {
      G.cursor.x = Math.max(0, Math.min(MAPW - 1, G.cursor.x + d[0]));
      G.cursor.y = Math.max(0, Math.min(MAPH - 1, G.cursor.y + d[1]));
    }
  }
});

// hooks for automated testing. ENTRANCE/EXIT/flow are exposed as getters
// since the underlying `let` bindings are reassigned wholesale on every
// resetGame() -- a plain property here would go stale after the first game.
window.YATD = { buildTower, upgradeTower, sellTower, startWave, resetGame,
                buildable, trapPlaceable, towerAt, path, map,
                getEntrance: () => ENTRANCE, getExit: () => EXIT,
                getFlow: () => G.flow, getFlowFly: () => G.flowFly,
                wouldSealPath };

/* ---------- main loop ---------- */
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  let dt = Math.min(0.25, (now - last) / 1000);
  last = now;
  acc += dt * G.speed;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  if (G.state === "title") { G.time += dt; drawTitle(); }
  else if (G.state === "won") drawWon();
  else if (G.state === "lost") drawLost();
  else drawGame();
  blit();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
