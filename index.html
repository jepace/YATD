<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YATD — Yet Another Tower Defense</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #050705;
    overflow: hidden;
    font-family: "DejaVu Sans Mono", "Menlo", "Consolas", monospace;
  }
  #frame {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #crt {
    position: relative;
    width: min(96vw, calc(96vh * 2));
    aspect-ratio: 2 / 1;
    background: #020302;
    border-radius: 18px;
    box-shadow: 0 0 60px rgba(40,255,110,0.10), inset 0 0 120px rgba(0,0,0,0.85);
    overflow: hidden;
  }
  #screen {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    filter: drop-shadow(0 0 3px rgba(80,255,140,0.35)) contrast(1.05) brightness(1.02);
    cursor: crosshair;
  }
  .scanlines {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0)   0px,
      rgba(0,0,0,0)   2px,
      rgba(0,0,0,0.22) 3px
    );
    mix-blend-mode: multiply;
    animation: flicker 4s infinite steps(60);
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }
  @keyframes flicker {
    0%,100% { opacity: 1; }
    31%  { opacity: .96; }
    32%  { opacity: 1; }
    67%  { opacity: .97; }
    68%  { opacity: 1; }
  }
</style>
</head>
<body>
<div id="frame">
  <div id="crt">
    <canvas id="screen"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>
</div>
<script>
"use strict";
/* ================= YATD — Yet Another Tower Defense =================
   A NetHack-flavored ASCII tower defense. Everything lives in this file. */

/* ---------- terminal grid ---------- */
const COLS = 80, ROWS = 24;        // row 0: messages, 1..21: map, 22-23: status
const MAPW = 80, MAPH = 21, MAPY = 1;
const CW = 12, CH = 20;

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
let dpr = 1;
function fitCanvas() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = COLS * CW * dpr;
  canvas.height = ROWS * CH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = '16px "DejaVu Sans Mono", "Menlo", "Consolas", monospace';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
}
fitCanvas();
window.addEventListener("resize", fitCanvas);

// character buffer
const buf = [];
for (let y = 0; y < ROWS; y++) {
  buf.push([]);
  for (let x = 0; x < COLS; x++) buf[y].push({ ch: " ", fg: "#4a7a4a", bg: null });
}
function put(x, y, ch, fg, bg) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
  const c = buf[y][x];
  c.ch = ch; c.fg = fg; if (bg !== undefined) c.bg = bg;
}
function text(x, y, s, fg, bg) {
  for (let i = 0; i < s.length; i++) put(x + i, y, s[i], fg, bg);
}
function clearBuf() {
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = buf[y][x]; c.ch = " "; c.fg = "#4a7a4a"; c.bg = null;
  }
}
function blit() {
  ctx.fillStyle = "#030503";
  ctx.fillRect(0, 0, COLS * CW, ROWS * CH);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = buf[y][x];
    if (c.bg) {
      ctx.fillStyle = c.bg;
      ctx.fillRect(x * CW, y * CH, CW, CH);
    }
    if (c.ch !== " ") {
      ctx.fillStyle = c.fg;
      ctx.fillText(c.ch, x * CW + CW / 2, y * CH + CH / 2 + 1);
    }
  }
}

/* ---------- dungeon map (procedurally generated) ---------- */
// Every game carves a fresh dungeon: a serpentine corridor from < to >
// plus rooms scattered along it. ?seed=N in the URL replays a dungeon;
// the current seed is shown on the title screen.
function mulberry32(s) {
  return function () {
    let t = s += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const urlSeed = parseInt(new URLSearchParams(location.search).get("seed"), 10);
let seedUsed = false;
function newSeed() {
  if (!seedUsed && !isNaN(urlSeed)) { seedUsed = true; return urlSeed; }
  return Math.floor(Math.random() * 2 ** 31);
}
let SEED = 0, rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));

const map = [];            // MAPH x MAPW of glyphs; ' ' = solid rock
for (let y = 0; y < MAPH; y++) map.push(new Array(MAPW).fill(" "));
const path = [];           // ordered [x,y], the GENERATOR's seed route
const pathIdx = new Map(); // "x,y" -> index along path (generation only)
let ENTRANCE = [0, 0], EXIT = [0, 0];   // the '<' and '>' cells

// serpentine waypoints: x-columns strictly increase, so no self-crossing
function genPath() {
  const xs = [2];
  while (xs[xs.length - 1] < 62) xs.push(xs[xs.length - 1] + ri(9, 15));
  xs[xs.length - 1] = Math.min(xs[xs.length - 1], 73);
  xs.push(77);
  let down = rnd() < 0.5;
  let y = down ? ri(2, 5) : ri(14, 17);
  const wp = [[xs[0], y]];
  for (let i = 1; i < xs.length; i++) {
    wp.push([xs[i], y]);
    if (i < xs.length - 1) {
      y = down ? ri(14, 17) : ri(2, 5);
      down = !down;
      wp.push([xs[i], y]);
    }
  }
  return wp;
}
function pathCells(wp) {
  const cells = [[wp[0][0], wp[0][1]]];
  let [cx, cy] = wp[0];
  for (let i = 1; i < wp.length; i++) {
    const [tx, ty] = wp[i];
    const dx = Math.sign(tx - cx), dy = Math.sign(ty - cy);
    while (cx !== tx || cy !== ty) { cx += dx; cy += dy; cells.push([cx, cy]); }
  }
  return cells;
}
// rooms seeded on random path cells; rejected if too close to another room
function genRooms(cells) {
  const rooms = [];
  const clash = (r) => rooms.some(o =>
    r[0] - 2 <= o[2] && o[0] - 2 <= r[2] && r[1] - 2 <= o[3] && o[1] - 2 <= r[3]);
  let tries = 0;
  while (rooms.length < 8 && tries++ < 250) {
    const [cx, cy] = cells[ri(0, cells.length - 1)];
    const w = ri(5, 9), h = ri(3, 5);
    const x1 = Math.max(1, Math.min(77 - w, cx - ri(0, w)));
    const y1 = Math.max(1, Math.min(19 - h, cy - ri(0, h)));
    const r = [x1, y1, x1 + w, y1 + h];
    if (!clash(r)) rooms.push(r);
  }
  return rooms;
}
// carve one level into map/path/pathIdx; returns a quality score
// (buildable floor tiles within tower reach of the path)
function buildLevel() {
  for (let y = 0; y < MAPH; y++) map[y].fill(" ");
  path.length = 0; pathIdx.clear();
  const wp = genPath();
  const cells = pathCells(wp);
  for (const [x1, y1, x2, y2] of genRooms(cells)) {
    for (let y = y1 - 1; y <= y2 + 1; y++) for (let x = x1 - 1; x <= x2 + 1; x++) {
      if (y < 0 || x < 0 || y >= MAPH || x >= MAPW) continue;
      if (y === y1 - 1 || y === y2 + 1) map[y][x] = "-";
      else if (x === x1 - 1 || x === x2 + 1) map[y][x] = "|";
      else map[y][x] = ".";
    }
  }
  for (const [x, y] of cells) {
    const k = x + "," + y;
    if (!pathIdx.has(k)) { pathIdx.set(k, path.length); path.push([x, y]); }
    const g = map[y][x];
    if (g === " ") map[y][x] = "#";
    else if (g === "|" || g === "-") map[y][x] = "+";
  }
  ENTRANCE = [wp[0][0], wp[0][1]];
  EXIT = wp[wp.length - 1];
  map[ENTRANCE[1]][ENTRANCE[0]] = "<";
  map[EXIT[1]][EXIT[0]] = ">";
  let deco = 0, guard = 0;
  while (deco < 3 && guard++ < 200) {
    const x = ri(1, 78), y = ri(1, 19);
    if (map[y][x] === "." && !onPath(x, y)) { map[y][x] = "{"; deco++; }
  }
  let good = 0;
  for (let y = 0; y < MAPH; y++) for (let x = 0; x < MAPW; x++) {
    if (map[y][x] !== "." || onPath(x, y)) continue;
    if (path.some(([px, py]) => Math.hypot(px - x, py - y) <= 4.5)) good++;
  }
  return good;
}
function genLevel() {
  SEED = newSeed();
  for (let i = 0; i < 80; i++) {
    rnd = mulberry32(SEED + i);        // deterministic retries per seed
    if (buildLevel() >= 60 && path.length >= 135) return;
  }
}

// Bresenham line walk: true if nothing solid (rock/wall) stands between
// the two cells. Used so ranged towers can't shoot through walls into
// the next corridor over.
function hasLineOfSight(x0, y0, x1, y1) {
  let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0;
  while (x !== x1 || y !== y1) {
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
    if (x === x1 && y === y1) break;
    const g = map[y] && map[y][x];
    if (g === " " || g === "|" || g === "-") return false;
  }
  return true;
}
const onPath = (x, y) => pathIdx.has(x + "," + y);
// Any tile that isn't solid rock or a wall can be walked on -- rooms,
// corridors, doors, stairs, decorative fountains. Blocking towers carve
// extra obstacles out of this at runtime (see computeFlow below).
const terrainWalkable = (x, y) => {
  const g = map[y] && map[y][x];
  return g === "." || g === "#" || g === "+" || g === "<" || g === ">" || g === "{";
};
const buildable = (x, y) =>
  map[y] && map[y][x] === "." && !towerAt(x, y) &&
  // block placement under a creep's current cell AND the cell it's
  // already committed to stepping into (mid-transit), so a blocking
  // tower can never land exactly where a monster is about to arrive
  !G.creeps.some(c => !c.dead &&
    ((c.x === x && c.y === y) || (c.nx === x && c.ny === y)));
const trapPlaceable = (x, y) => {
  const g = map[y] && map[y][x];
  return (g === "#" || g === "+") && !towerAt(x, y);
};

// Monsters don't follow a fixed line -- every game tick they take the
// shortest currently-open route to the stairs, recomputed as a BFS flow
// field (dist-to-exit + which neighbor to step toward) whenever a
// blocking tower is built or sold. `extraBlocked` lets buildTower() do a
// dry-run check before committing to a placement. `ignoreTowerBlocks`
// computes the field flying monsters use -- they cut straight through
// any wall of towers, only rock/walls stop them (see G.flowFly).
function computeFlow(extraBlocked, ignoreTowerBlocks) {
  const dist = Array.from({ length: MAPH }, () => new Array(MAPW).fill(Infinity));
  const next = Array.from({ length: MAPH }, () => new Array(MAPW).fill(null));
  const blocked = new Set(ignoreTowerBlocks ? [] :
    G.towers.filter(t => TOWERS[t.type].blocks).map(t => t.x + "," + t.y));
  if (extraBlocked) for (const [ex, ey] of extraBlocked) blocked.add(ex + "," + ey);
  const passable = (x, y) =>
    x >= 0 && y >= 0 && x < MAPW && y < MAPH &&
    terrainWalkable(x, y) && !blocked.has(x + "," + y);
  const [ex, ey] = EXIT;
  if (!passable(ex, ey)) return { dist, next };
  dist[ey][ex] = 0;
  const q = [[ex, ey]];
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (let i = 0; i < q.length; i++) {
    const [cx, cy] = q[i];
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      if (!passable(nx, ny) || dist[ny][nx] <= dist[cy][cx] + 1) continue;
      dist[ny][nx] = dist[cy][cx] + 1;
      next[ny][nx] = [cx, cy];
      q.push([nx, ny]);
    }
  }
  return { dist, next };
}
// true if placing a blocking tower at (x,y) would cut off every route
// from the stairs down to the stairs up
function wouldSealPath(x, y) {
  const { dist } = computeFlow([[x, y]]);
  return !isFinite(dist[ENTRANCE[1]][ENTRANCE[0]]);
}

const TERRAIN_COLOR = {
  "-": "#9aa88a", "|": "#9aa88a", ".": "#3d6b3d", "#": "#6e6e5c",
  "+": "#c8a832", "<": "#e8e8d8", ">": "#e8e8d8", "{": "#4aa8ff", " ": "#000",
};

/* ---------- data tables ---------- */
// Tower glyphs deliberately avoid letters: in this game (as in NetHack)
// letters are reserved for monsters, so towers use NetHack object-class
// punctuation instead -- no ambiguity about what's a monster on the map.
// `blocks: true` towers physically occupy their tile -- monsters route
// around them (see computeFlow). The fire trap is flush with the floor
// and never blocks; monsters walk over it and trigger it on contact.
// `siegeHp` (bolt/splash/slow/chain towers) is a separate durability pool
// from the wall's `hp` -- only a `siege: true` monster can chip at it (see
// MONSTERS below and updateSiege()), unlike the wall, which any adjacent
// creep chips just by touching it. This is the counter to a "pipe of
// death" corridor: a maze that's 100% safe from melee once built no
// longer stays that way once a siege-flagged monster reaches it.
// TOWERS[1] (Archer) is the only type available from a fresh game --
// every other type carries `unlockCost`, a one-time flat (not dlvl-
// scaled, unlike `towerCost`) gold payment that permanently adds it to
// `G.unlocked` (see unlockTower()); it never re-locks and persists
// across a descend() same as G.gold/G.plevel do. This is a second,
// separate progression axis from player level: player level gates how
// far a tower you already have access to can be enchanted, unlocking
// gates whether you have access to a tower type at all.
const TOWERS = {
  1: { ch: "/", name: "Archer", cost: 18, dmg: 5, range: 5.0, cd: 0.55,
       kind: "bolt", blocks: true, maxCharges: 25, siegeHp: 30, fg: "#e8e850",
       desc: "a hired archer -- quick shots, limited arrows, restocks slowly" },
  2: { ch: "0", name: "Acid Blob", cost: 25, unlockCost: 40, dmg: 7, range: 4.0, cd: 1.2,
       kind: "splash", blocks: true, splash: 1.6, siegeHp: 45, fg: "#50e850",
       desc: "lobs acid; splash damage" },
  3: { ch: "{", name: "Frost Fountain", cost: 20, unlockCost: 35, dmg: 2, range: 3.5, cd: 0.7,
       kind: "slow", blocks: true, slow: 0.5, slowDur: 2.0, siegeHp: 35, fg: "#50c8e8",
       desc: "chills and slows nearby monsters" },
  4: { ch: "^", name: "Fire Trap", cost: 15, unlockCost: 30, dmg: 14, range: 0, cd: 0.5,
       kind: "trap", blocks: false, trapHp: 12, fg: "#e85050",
       desc: "burns monsters standing on it (place ON the corridor) -- can be disarmed" },
  5: { ch: "\\", name: "Wand of Lightning", cost: 30, unlockCost: 70, dmg: 6, range: 4.5, cd: 0.9,
       kind: "chain", blocks: true, maxCharges: 12, chainCount: 2, chainRange: 3.5,
       chainFalloff: 0.6, siegeHp: 50, fg: "#c8f0ff",
       desc: "arcs to 2 more targets; limited charges, recharges slowly" },
  6: { ch: "%", name: "Dirt Wall", cost: 8, unlockCost: 15, range: 0, cd: 0,
       kind: "wall", blocks: true, hp: 25, fg: "#8a6a4a",
       desc: "cheap, pure obstacle -- monsters chip through it over time" },
};
const UPG_MULT = 1.6, UPG_RANGE = 0.5, MAX_LVL = 4;
// trims both gold income and XP together (see damageCreep) -- a single
// economy-wide knob. Dropped to 0.75 after reports of finishing Dlvl 1
// already at max player level, sitting on hundreds of unspent zorkmids,
// and clearing waves without a single tower past L1 -- the early game
// was simply too lucrative to ever feel like resources mattered.
const BOUNTY_MULT = 0.75;
// player level gates how far ANY tower can be enchanted, independent of
// gold -- a fresh player level 1 can only bring towers to L1 even with
// gold to spare, same as MAX_LVL always has, but now MAX_LVL is only
// reachable once G.plevel itself reaches it. XP is earned per kill
// (gainXp, called from damageCreep) and persists across a descend() the
// same way G.gold/G.score do -- resetGame() is the only place it resets.
// Thresholds are deliberately steep past level 2: reaching MAX_LVL (4)
// should feel like a real milestone earned over multiple dungeon levels,
// not something that happens by wave 9 of Dlvl 1.
const PLAYER_XP_THRESHOLDS = [0, 100, 300, 800]; // cumulative xp for player level 1,2,3,4
function playerLevelForXp(xp) {
  let lvl = 1;
  for (let i = 1; i < PLAYER_XP_THRESHOLDS.length; i++) if (xp >= PLAYER_XP_THRESHOLDS[i]) lvl = i + 1;
  return lvl;
}
const playerMaxTowerLvl = () => Math.min(MAX_LVL, G.plevel);
function gainXp(amount) {
  G.xp += amount;
  const lvl = playerLevelForXp(G.xp);
  if (lvl > G.plevel) {
    G.plevel = lvl;
    message("You feel more experienced!  (player level " + G.plevel +
      " -- towers can enchant to L" + G.plevel + " now)  --More--");
    G.paused = true;
  }
}
// gold buys less the deeper you go -- zorkmids you're still carrying at
// Dlvl 5 shouldn't be worth what they were on Dlvl 1
const towerCost = (type) => Math.round(TOWERS[type].cost * Math.pow(1.18, G.dlvl - 1));
const upgradeCost = (t) => towerCost(t.type) * (t.lvl + 1);
const towerMaxHp = (t) => Math.round(TOWERS[t.type].hp * Math.pow(1.5, t.lvl - 1));
const towerMaxSiegeHp = (t) => Math.round(TOWERS[t.type].siegeHp * Math.pow(1.5, t.lvl - 1));
const towerMaxTrapHp = (t) => Math.round(TOWERS[t.type].trapHp * Math.pow(1.5, t.lvl - 1));
const WALL_DPS = 6;    // how fast an adjacent creep chips a dirt wall down
const SIEGE_DPS = 4;   // how fast a siege: true monster chips any other blocking tower
const DISARM_DPS = 5;  // how fast a disarms: true monster disables a fire trap it's standing on
const BASE_REGEN = 0.4;   // hp/sec -- every monster heals a little if left alone

// `ch` is the map glyph -- kept separate from the MONSTERS key so several
// tiers can share one letter with a different name/color/stats, exactly
// like real NetHack's monster classes (e.g. the canine class 'd' covers
// jackal through warg). `flies: true` ignores every blocking tower (only
// rock/walls stop it -- see G.flowFly/creepFlow) -- the counter to a
// turtled tower maze. `splits`: on death, a chance to spawn a weaker copy
// of itself (`child: true` on the spawned copy stops it from splitting
// again). `submerges`: periodically untargetable by every damage source
// except the fireball scroll (see isSubmerged()). `regen`: hp/sec passive
// heal, overriding BASE_REGEN (which every monster gets by default).
// `siege: true` is the counter to a "pipe of death" -- a maze corridor
// lined solid with towers that, once built, is otherwise permanently
// safe -- by letting a handful of brutish/martial tiers (orc captain,
// troll/chieftain, ogre, horned devil) chip SIEGE_DPS off any adjacent
// non-wall blocking tower's `siegeHp` (see updateSiege()) exactly the
// way any creep already chips a dirt wall's `hp`; reaching 0 destroys
// the tower with no refund and recomputes the flow field, same as a
// wall crumbling. `disarms: true` (gnome, dwarf) lets a monster stand on
// a fire trap and wear down its `trapHp` at DISARM_DPS instead of
// triggering it, disabling it with no refund once it reaches 0 --
// the trap's own answer to "wicked powerful and otherwise permanent."
const MONSTERS = {
  rat:      { name: "sewer rat",     ch: "r", hp: 9,   spd: 3.4, bounty: 2,  leak: 1, fg: "#b8825a",
              lore: "A common sewer rat -- more nuisance than threat, but there's rarely just one." },
  gridbug:  { name: "grid bug",      ch: "x", hp: 5,   spd: 3.6, bounty: 1,  leak: 1, fg: "#c8c850",
              lore: "Grid bugs can only move along the compass directions. Harmless, mostly a joke." },
  ant:      { name: "giant ant",     ch: "a", hp: 8,   spd: 4.0, bounty: 1,  leak: 1, fg: "#d0d050",
              lore: "A giant ant, fast on its feet and rarely alone for long." },
  jackal:   { name: "jackal",        ch: "d", hp: 12,  spd: 3.8, bounty: 2,  leak: 1, fg: "#c89858",
              lore: "Jackals hunt in loose packs, yipping as they close in." },
  bat:      { name: "cave bat",      ch: "b", hp: 10,  spd: 4.5, bounty: 3,  leak: 1, fg: "#a050e8", flies: true,
              lore: "A cave bat flits erratically overhead -- and straight over your maze." },
  kobold:   { name: "kobold",        ch: "k", hp: 18,  spd: 2.2, bounty: 3,  leak: 1, fg: "#e85050",
              lore: "A kobold, small and cowardly alone, but never truly alone." },

  eel:      { name: "giant eel",     ch: ";", hp: 30,  spd: 2.0, bounty: 5,  leak: 2, fg: "#50a8e8",
              submerges: true, immuneTo: "electric",
              lore: "A giant eel lurks beneath the surface, surfacing only to strike -- lightning won't touch it." },
  orc:      { name: "orc",           ch: "o", hp: 42,  spd: 1.8, bounty: 5,  leak: 2, fg: "#e8a050",
              lore: "An orc raider, crude blade in hand, drawn to the smell of gold." },
  gnome:    { name: "gnome",         ch: "G", hp: 20,  spd: 2.6, bounty: 3,  leak: 1, fg: "#78c878", disarms: true,
              lore: "A gnome tinkerer -- weak in a fight, but knows exactly how to disarm a trap." },
  dwarf:    { name: "dwarf",         ch: "h", hp: 35,  spd: 2.0, bounty: 6,  leak: 2, fg: "#c8a850", disarms: true,
              lore: "A dwarf, pick-axe in hand, unafraid of stone -- or of your traps." },
  lichen:   { name: "lichen",        ch: "F", hp: 15,  spd: 0.8, bounty: 2,  leak: 1, fg: "#68a868",
              lore: "A patch of green lichen -- slow and sticky, easy to underestimate." },
  spider:   { name: "giant spider",  ch: "s", hp: 22,  spd: 3.0, bounty: 4,  leak: 1, fg: "#8858c8",
              lore: "A giant spider skitters low and quick, hugging the walls." },

    if (t.lvl < MAX_LVL) {
      const label = t.lvl < playerMaxTowerLvl()
        ? "Upgrade to L" + (t.lvl + 1) + " ($" + upgradeCost(t) + ")"
        : "Upgrade to L" + (t.lvl + 1) + " (need player level " + (t.lvl + 1) + ")";
      opts.push({ key: "u", label, action: () => upgradeTower(t), keepOpen: true });
    }
    opts.push({ key: "s", label: "Sell (+$" + Math.floor(t.spent * 0.7) + ")",
                action: () => sellTower(t), keepOpen: true });
    return { tower: t, opts };
  }
  const opts = [];
  for (let n = 1; n <= 6; n++) {
    const spec = TOWERS[n];
    const ok = spec.kind === "trap" ? trapPlaceable(x, y) : buildable(x, y);
    if (!ok) continue;
    if (!G.unlocked[n]) {
      opts.push({ key: String(n), label: "Unlock " + spec.ch + " " + spec.name + " ($" + spec.unlockCost + ", one-time)",
                  action: () => unlockTower(n), keepOpen: true });
    } else {
      opts.push({ key: String(n), label: spec.ch + " " + spec.name + " ($" + towerCost(n) + ")",
                  action: () => buildTower(n, x, y) });
    }
  }
  return { tower: null, opts };
}
// menuOptions() plus how many header lines (a live stats readout, only
// for an existing tower) sit above the option list -- drawMenu() and
// mousedown's click-hit-test both derive their line math from this SAME
// function so they can never disagree about where an option line is
function menuLayout(x, y) {
  const r = menuOptions(x, y);
  return { ...r, headerLines: r.tower ? 1 : 0 };
}

/* ---------- combat ---------- */
// flavor text for a shrugged-off elemental hit -- keyed by dtype, not by
// monster, since it describes the damage type failing, not the monster
const IMMUNE_FLAVOR = {
  fire: "bounces off its thick scales",
  cold: "melts away without effect",
  electric: "arcs harmlessly past it",
  acid: "does nothing to its hide",
};
function damageCreep(c, dmg, dtype) {
  const m0 = MONSTERS[c.type];
  if (dtype && m0.immuneTo === dtype) {
    c.hitFlash = 0.1;
    // only once per creep -- a tower firing every cd tick would otherwise
    // spam the message line and bury anything else worth seeing
    if (!c.immuneMsgShown) {
      c.immuneMsgShown = true;
      message("The " + dtype + " " + (IMMUNE_FLAVOR[dtype] || "has no effect") +
        " on the " + m0.name + "!");
    }
    return; // shrugs it off entirely
  }
  c.hp -= dmg; c.hitFlash = 0.1;
  if (c.hp <= 0 && !c.dead) {
    c.dead = true;
    const m = MONSTERS[c.type];
    const [cx, cy] = creepCell(c);
    deathFx(cx, cy, m.fg);
    // BOUNTY_MULT trims both gold income and XP together (gainXp uses the
    // same trimmed amount) -- a single economy-wide knob rather than
    // hand-editing all ~30 monsters' bounty fields individually
    const bounty = Math.round(m.bounty * BOUNTY_MULT);
    G.gold += bounty; G.kills++; G.score += bounty * 10;
    if (m.boss) {
      message("The " + m.name + " is destroyed!  You feel a surge of triumph!  --More--");
      G.paused = true;
    }
    else message("The " + m.name + " is destroyed. (+" + bounty + " zorkmids)");
    if (!m.boss && rnd() < 0.08) dropItem();
    if (m.splits && !c.child && rnd() < m.splitChance) spawnChild(c, m);
    gainXp(bounty); // called last so a level-up's --More-- message wins over the kill message
  }
}
// a lesser copy that claws free of a split monster's corpse -- carries
// child:true so it can't chain-split itself
function spawnChild(parent, m) {
  const child = {
    type: parent.type, x: parent.x, y: parent.y, nx: parent.x, ny: parent.y, t: 0,
    hp: Math.max(1, Math.round(parent.maxHp * m.splitHpFrac)),
    maxHp: Math.max(1, Math.round(parent.maxHp * m.splitHpFrac)),
    spd: parent.spd, jit: ri(-1, 1), subPhase: rnd() * 4,
    slowUntil: 0, hitFlash: 0, child: true,
  };
  advanceTarget(child);
  G.creeps.push(child);
  message("A lesser " + m.name + " claws free!");
}

/* ---------- items (random drops from kills) ---------- */
function dropItem() {
  const roll = rnd();
  if (roll < 0.35) {
    const g = 5 + G.wave * 2;
    G.gold += g;
    message("You find a small pile of zorkmids! (+" + g + ")");
  } else if (roll < 0.55) {
    G.inv.scroll++;
    message("You find a scroll labeled ELBIB YLOH!  [r]ead it for fiery doom.");
  } else if (roll < 0.75) {
    G.inv.potion++;
    message("You find a fizzy potion!  [q]uaff to hasten your towers.");
  } else if (roll < 0.9) {
    G.inv.wand++;
    message("You find a wand of cold!  [z]ap it to chill every monster.");
  } else {
    G.inv.charge++;
    message("You find a wand of charging!  [c]harge to restore your towers.");
  }
}
// scroll of fireball and wand of cold are targeted: pressing the hotkey
// arms G.targeting instead of firing immediately, and the next click (or
// ENTER on the cursor) picks the impact point -- see resolveTargeting()
function beginScroll() {
  if (G.inv.scroll < 1) { message("You have no scrolls to read."); return; }
  setTargeting({ kind: "scroll", radius: 4.0 });
  message("Where do you want to hurl the fireball?  (click a tile, ESC cancels)");
}
function beginWand() {
  if (G.inv.wand < 1) { message("You have no wands to zap."); return; }
  setTargeting({ kind: "wand", radius: 4.5 });
  message("Where do you want to aim the wand of cold?  (click a tile, ESC cancels)");
}
function resolveTargeting(x, y) {
  const { kind, radius } = G.targeting;
  setTargeting(null);
  const inRange = c => {
    if (c.dead) return false;
    const [cx, cy] = creepCell(c);
    return Math.hypot(cx - x, cy - y) <= radius;
  };
  if (kind === "scroll") {
    G.inv.scroll--;
    let hit = 0;
    for (const c of [...G.creeps]) {
      if (!inRange(c)) continue;
      const [cx, cy] = creepCell(c);
      splashFx(cx, cy, "#ff8850");
      damageCreep(c, 45, "fire");
      hit++;
    }
    message(hit
      ? "You read the scroll.  A pillar of flame erupts!"
      : "You read the scroll, but nothing was close enough to burn.");
  } else if (kind === "wand") {
    G.inv.wand--;
    let hit = 0;
    for (const c of G.creeps) {
      if (!inRange(c)) continue;
      c.slowUntil = G.time + 4; c.slowFactor = 0.4;
      hit++;
    }
    message(hit
      ? "You zap the wand of cold.  Monsters nearby shiver and slow!"
      : "You zap the wand of cold, but nothing was close enough to chill.");
  }
}
function usePotion() {
  if (G.inv.potion < 1) { message("You have no potions to quaff."); return; }
  G.inv.potion--;
  G.hasteUntil = G.time + 8;
  message("Gulp.  Your towers hum with supernatural speed! (8s)");
}
function useCharge() {
  if (G.inv.charge < 1) { message("You have no wands of charging."); return; }
  G.inv.charge--;
  // like the real thing, this is not a guaranteed full recharge -- each
  // tower gets its own roll (t.lvl dice of d6), so nothing is ever a sure
  // top-off and a level-1 tower barely benefits compared to a level-4 one
  const roll = (t) => { let r = 0; for (let i = 0; i < t.lvl; i++) r += ri(1, 6); return r; };
  let restored = 0;
  for (const t of G.towers) {
    const spec = TOWERS[t.type];
    if (spec.maxCharges && t.charges < towerMaxCharges(t)) {
      t.charges = Math.min(towerMaxCharges(t), t.charges + roll(t));
      restored++;
    }
    if (spec.hp && t.hp < towerMaxHp(t)) {
      t.hp = Math.min(towerMaxHp(t), t.hp + roll(t));
      restored++;
    }
    if (spec.siegeHp && t.siegeHp < towerMaxSiegeHp(t)) {
      t.siegeHp = Math.min(towerMaxSiegeHp(t), t.siegeHp + roll(t));
      restored++;
    }
    if (spec.trapHp && t.trapHp < towerMaxTrapHp(t)) {
      t.trapHp = Math.min(towerMaxTrapHp(t), t.trapHp + roll(t));
      restored++;
    }
  }
  message(restored
    ? "You zap the wand of charging.  Your arsenal crackles with renewed power!"
    : "You zap the wand of charging, but nothing here needed it.");
}
function beamFx(x1, y1, x2, y2, fg) {
  const dx = x2 - x1, dy = y2 - y1;
  const n = Math.max(Math.abs(dx), Math.abs(dy));
  const ch = dx === 0 ? "|" : dy === 0 ? "-" : (dx > 0) === (dy > 0) ? "\\" : "/";
  const cells = [];
  for (let i = 1; i < n; i++)
    cells.push([Math.round(x1 + dx * i / n), Math.round(y1 + dy * i / n)]);
  G.fx.push({ cells, ch, fg, ttl: 0.08 });
}
function splashFx(x, y, fg) {
  const cells = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
    cells.push([x + dx, y + dy]);
  G.fx.push({ cells, ch: "*", fg, ttl: 0.12 });
}
// a dying creep is removed from G.creeps in the very same update() call
// that killed it (updateTowers runs before updateCreeps, and updateCreeps
// filters dead creeps immediately) -- with no per-frame death animation,
// a kill that lands the instant before draw() next runs was never
// actually rendered, which reads as the monster just vanishing without
// being "shown" at all (most noticeable right at the exit, since that's
// exactly where the player is watching closely for a leak). A short-
// lived corpse glyph (NetHack's own convention for a fresh kill) at the
// creep's last cell guarantees at least one visible frame regardless of
// exactly when in the update the kill landed.
function deathFx(x, y, fg) {
  G.fx.push({ cells: [[x, y]], ch: "%", fg, ttl: 0.35 });
}

function updateTowers(dt) {
  const hasteMul = G.time < G.hasteUntil ? 0.5 : 1;   // potion of haste
  for (const t of G.towers) {
    const spec = TOWERS[t.type];
    if (spec.kind === "wall") continue; // pure obstacle, no combat behavior
    if (spec.maxCharges) {
      const max = towerMaxCharges(t);
      if (t.charges < max) t.charges = Math.min(max, t.charges + CHARGE_REGEN * dt);
    }
    t.cd -= dt;
    if (t.cd > 0) continue;
    const dmg = towerDmg(t), range = towerRange(t);
    if (spec.kind === "trap") {
      // flying creeps pass over a flush-with-the-floor trap the same way
      // they pass over a blocking tower -- they never touch the ground
      const victims = G.creeps.filter(c => {
        const [x, y] = creepCell(c);
        return !c.dead && !isSubmerged(c) && !MONSTERS[c.type].flies && x === t.x && y === t.y;
      });
      if (victims.length) {
        for (const c of victims) damageCreep(c, dmg, "fire");
        splashFx(t.x, t.y, spec.fg);
        t.cd = spec.cd * hasteMul;
      }
      continue;
    }
    // pick target(s) furthest along (closest to the exit) within range and LOS
    let targets = G.creeps.filter(c => {
      if (c.dead || isSubmerged(c)) return false;
      const [x, y] = creepCell(c);
      return Math.hypot(x - t.x, y - t.y) <= range && hasLineOfSight(t.x, t.y, x, y);
    }).sort((a, b) => creepProgress(a) - creepProgress(b));
    if (!targets.length) continue;
    if (spec.kind === "slow") {
      let hit = false;
      for (const c of targets) {
        c.slowUntil = G.time + spec.slowDur; c.slowFactor = spec.slow;
        damageCreep(c, dmg, "cold"); hit = true;
      }
      if (hit) {
        const [x, y] = creepCell(targets[0]);
        beamFx(t.x, t.y, x, y, spec.fg);
        t.cd = spec.cd * hasteMul;
      }
    } else if (spec.kind === "splash") {
      const c0 = targets[0];
      const [cx, cy] = creepCell(c0);
      for (const c of G.creeps) {
        if (c.dead || isSubmerged(c)) continue;
        const [x, y] = creepCell(c);
        if (Math.hypot(x - cx, y - cy) <= spec.splash &&
            hasLineOfSight(cx, cy, x, y)) damageCreep(c, dmg, "acid");
      }
      splashFx(cx, cy, spec.fg);
      t.cd = spec.cd * hasteMul;
    } else if (spec.kind === "chain") {
      if (spec.maxCharges && Math.floor(t.charges) < 1) continue; // out of charges
      if (spec.maxCharges) t.charges--;
      let dmgThis = dmg, current = targets[0];
      let [fromX, fromY] = [t.x, t.y];
      const hit = new Set();
      for (let i = 0; current && i <= spec.chainCount; i++) {
        damageCreep(current, dmgThis, "electric");
        hit.add(current);
        const [cx, cy] = creepCell(current);
        beamFx(fromX, fromY, cx, cy, spec.fg);
        fromX = cx; fromY = cy;
        dmgThis = Math.round(dmgThis * spec.chainFalloff);
        // arc to the nearest un-hit, visible, non-submerged creep in range
        let next = null, bestD = Infinity;
        for (const c of G.creeps) {
          if (c.dead || hit.has(c) || isSubmerged(c)) continue;
          const [x, y] = creepCell(c);
          const d = Math.hypot(x - fromX, y - fromY);
          if (d <= spec.chainRange && d < bestD && hasLineOfSight(fromX, fromY, x, y)) {
            bestD = d; next = c;
          }
        }
        current = next;
      }
      t.cd = spec.cd * hasteMul;
    } else { // bolt
      if (spec.maxCharges && Math.floor(t.charges) < 1) continue; // out of charges
      if (spec.maxCharges) t.charges--;
      damageCreep(targets[0], dmg);
      const [x, y] = creepCell(targets[0]);
      beamFx(t.x, t.y, x, y, spec.fg);
      t.cd = spec.cd * hasteMul;
    }
  }
}

function updateCreeps(dt) {
  const [ex, ey] = EXIT;
  for (const c of G.creeps) {
    if (c.dead) continue;
    const m = MONSTERS[c.type];
    // every monster heals slowly if left alone, same as a tower recharging
    // -- m.regen (currently only the troll) overrides the baseline rate
    if (c.hp < c.maxHp) c.hp = Math.min(c.maxHp, c.hp + (m.regen || BASE_REGEN) * dt);
    c.hitFlash = Math.max(0, c.hitFlash - dt);
    let spd = c.spd;
    if (G.time < c.slowUntil) spd *= c.slowFactor;
    c.t += spd * dt;
    // consume whole-cell steps; a while loop lets fast creeps or high
    // game speed cross several cells in one update without stalling
    while (c.t >= 1 && !c.dead) {
      c.t -= 1;
      c.x = c.nx; c.y = c.ny;
      if (c.x === ex && c.y === ey) {
        c.dead = true; c.leaked = true;
        // same reasoning as deathFx() -- a leaked creep is filtered out
        // of G.creeps in this very call, so without a marker it would
        // never actually be seen reaching the stairs
        G.fx.push({ cells: [[ex, ey]], ch: m.ch, fg: "#ff5050", ttl: 0.35 });
        G.hp -= m.leak;
        message("The " + m.name + " descends the stairs!  You lose " + m.leak + " HP.");
        if (G.hp <= 0) { G.hp = 0; G.state = "lost"; }
        break;
      }
      advanceTarget(c);
      if (c.nx === c.x && c.ny === c.y) { c.t = 0; break; } // no route -- wait in place
    }
  }
  G.creeps = G.creeps.filter(c => !c.dead);
}

// dirt walls are pure obstacles with no offense of their own -- any live
// creep standing orthogonally adjacent chips away at WALL_DPS, and a
// wall that reaches 0 hp crumbles (no refund, unlike selling)
function updateWalls(dt) {
  let anyBroken = false;
  for (const t of G.towers) {
    if (!TOWERS[t.type].hp) continue;
    const adjacent = G.creeps.some(c =>
      !c.dead && Math.abs(c.x - t.x) + Math.abs(c.y - t.y) === 1);
    if (!adjacent) continue;
    t.hp -= WALL_DPS * dt;
    if (t.hp <= 0) { t.broken = true; anyBroken = true; }
  }
  if (anyBroken) {
    const broken = G.towers.filter(t => t.broken);
    G.towers = G.towers.filter(t => !t.broken);
    G.flow = computeFlow();
    for (const t of broken) message("The " + TOWERS[t.type].name + " crumbles under the assault!");
  }
}

// the counter to a "pipe of death": a `siege: true` monster orthogonally
// adjacent to any non-wall blocking tower chips its `siegeHp` down at
// SIEGE_DPS (mirrors updateWalls' dirt-wall logic, but gated to a subset
// of tough/martial monsters instead of every creep); a `disarms: true`
// monster standing directly on a fire trap chips its `trapHp` down at
// DISARM_DPS instead of triggering it. Both destroy the tower with no
// refund once their hp hits 0 -- siege recomputes the flow field since
// the tile becomes walkable again, disarming doesn't since traps never
// blocked movement in the first place.
function updateSiege(dt) {
  let anyGone = false;
  for (const t of G.towers) {
    const spec = TOWERS[t.type];
    if (spec.siegeHp) {
      const attacker = G.creeps.some(c =>
        !c.dead && MONSTERS[c.type].siege &&
        Math.abs(c.x - t.x) + Math.abs(c.y - t.y) === 1);
      if (!attacker) continue;
      t.siegeHp -= SIEGE_DPS * dt;
      if (t.siegeHp <= 0) { t.gone = true; t.goneMsg = "crumbles under the assault"; anyGone = true; }
    } else if (spec.trapHp) {
      const attacker = G.creeps.some(c => {
        if (c.dead || !MONSTERS[c.type].disarms) return false;
        const [x, y] = creepCell(c);
        return x === t.x && y === t.y;
      });
      if (!attacker) continue;
      t.trapHp -= DISARM_DPS * dt;
      if (t.trapHp <= 0) { t.gone = true; t.goneMsg = "is disarmed"; anyGone = true; }
    }
  }
  if (anyGone) {
    const gone = G.towers.filter(t => t.gone);
    G.towers = G.towers.filter(t => !t.gone);
    if (gone.some(t => TOWERS[t.type].blocks)) G.flow = computeFlow();
    for (const t of gone) message("The " + TOWERS[t.type].name + " " + t.goneMsg + "!");
  }
}

function update(dt) {
  if (G.paused) return;
  G.time += dt;
  G.msgAge += dt;
  for (const f of G.fx) f.ttl -= dt;
  G.fx = G.fx.filter(f => f.ttl > 0);

  if (G.state !== "wave") return;

  // spawning
  G.spawnTimer += dt;
  while (G.spawnQueue.length && G.spawnQueue[0].at <= G.spawnTimer) {
    spawnCreep(G.spawnQueue.shift().t);
  }
  updateTowers(dt);
  updateCreeps(dt);
  updateWalls(dt);
  updateSiege(dt);

  if (!G.paused && G.state === "wave" && !G.spawnQueue.length && !G.creeps.length) {
    // wave cleared
    const bonus = 10 + G.wave * 2;
    G.gold += bonus; G.score += 100 * G.wave * G.dlvl;
    if (G.wave >= WAVES.length) {
      if (G.dlvl >= MAX_DLVL) {
        G.state = "won";
        G.score += G.hp * 50;
      } else {
        descend();
        if (G.autoStart) startWave();
      }
    } else {
      G.state = "build";
      message("The dungeon falls silent.  Wave bonus: " + bonus + " zorkmids." +
        (G.autoStart ? "" : "  --More--"));
      if (G.autoStart) startWave();
    }
  }
}

/* ---------- rendering ---------- */
function drawMap() {
  for (let y = 0; y < MAPH; y++) for (let x = 0; x < MAPW; x++) {
    const g = map[y][x];
    if (g !== " ") put(x, MAPY + y, g, TERRAIN_COLOR[g]);
  }
}
function drawRange(cx, cy, range, tint) {
  if (range <= 0) return;
  for (let y = 0; y < MAPH; y++) for (let x = 0; x < MAPW; x++) {
    if (map[y][x] === " ") continue;
    if (Math.hypot(x - cx, y - cy) <= range) buf[MAPY + y][x].bg = tint;
  }
}
function drawGame() {
  clearBuf();
  drawMap();

  // range preview: only meaningful once a menu is open on an existing tower
  const hx = G.cursor.on ? G.cursor.x : G.hover.x;
  const hy = G.cursor.on ? G.cursor.y : G.hover.y;
  const menuTower = G.menu && towerAt(G.menu.x, G.menu.y);
  if (menuTower) drawRange(menuTower.x, menuTower.y, towerRange(menuTower), "#12241a");
  if (G.targeting) drawRange(hx, hy, G.targeting.radius, "#2a1a1a");

  for (const t of G.towers) {
    const spec = TOWERS[t.type];
    const empty = spec.maxCharges && Math.floor(t.charges) < 1;
    const cracked = (spec.hp && t.hp < towerMaxHp(t) * 0.4) ||
                    (spec.siegeHp && t.siegeHp < towerMaxSiegeHp(t) * 0.4);
    const bright = ["", "", "#ffffff", "#ffd0ff", "#ffb000"][t.lvl] || spec.fg;
    const fg = (empty || cracked) ? "#4a4a3a" : (t.lvl === 1 ? spec.fg : bright);
    const picked = G.menu && G.menu.x === t.x && G.menu.y === t.y;
    put(t.x, MAPY + t.y, spec.ch, fg, picked ? "#243024" : undefined);
  }
  for (const c of G.creeps) {
    const [x, y] = creepCell(c);
    const m = MONSTERS[c.type];
    const fg = c.hitFlash > 0 ? "#ffffff" : (isSubmerged(c) ? "#2a4a5a" : m.fg);
    // flying creeps ignore blocking towers and can share a tower's cell --
    // tint the background so it reads as "flying over", not "on top of"
    const bg = m.flies && towerAt(x, y) ? "#241a30" : undefined;
    put(x, MAPY + y, m.ch, fg, bg);
  }
  for (const f of G.fx)
    for (const [x, y] of f.cells)
      if (y >= 0 && y < MAPH && map[y][x] !== " ") put(x, MAPY + y, f.ch, f.fg);

  // keyboard cursor
  if (G.cursor.on) {
    const cell = buf[MAPY + G.cursor.y][G.cursor.x];
    cell.bg = "#3a4a3a";
  }

  // message line -- a trailing "--More--" (NetHack's own wording) renders
  // in reverse video, same as the real thing, instead of plain text
  const fade = G.msgAge > 6 ? "#4a6a4a" : "#d8e8c8";
  const moreTag = "--More--";
  if (G.msg.endsWith(moreTag)) {
    const body = G.msg.slice(0, -moreTag.length);
    text(0, 0, body.slice(0, COLS), fade);
    const mx = Math.min(COLS - moreTag.length, body.length);
    for (let i = 0; i < moreTag.length; i++) put(mx + i, 0, moreTag[i], "#0a120a", "#c8e8b8");
  } else {
    text(0, 0, G.msg.slice(0, COLS), fade);
  }

  // status lines
  const spd = G.speed > 1 ? "  x" + G.speed : "";
  const auto = (G.autoStart ? "  [auto]" : "") +
               (G.time < G.hasteUntil ? "  [haste]" : "");
  text(0, 22,
    ("Dlvl:" + G.dlvl + "  $:" + G.gold + "  HP:" + G.hp + "(" + G.maxHp + ")  Wave:" +
     G.wave + "/" + WAVES.length + "  Lv:" + G.plevel + "  Kills:" + G.kills + "  Score:" + G.score +
     spd + auto).padEnd(COLS).slice(0, COLS), "#c8d8b8");
  if (G.paused) {
    const paused = "*** PAUSED ***";
    text(COLS - paused.length, 22, paused, "#ffe850");
  }

  const spaceHint = G.state === "wave"
    ? (G.paused ? "SPACE:resume" : "SPACE:pause")
    : "SPACE:start wave";
  let l2 = "Click a tile for options   " + spaceHint + "   i:inv  ?:help";
  // hovered monster info takes priority over the generic hint
  if (hy >= 0 && hy < MAPH) {
    const c = G.creeps.find(c => {
      const [x, y] = creepCell(c); return x === hx && y === hy;
    });
    if (c) l2 = "You see: " + MONSTERS[c.type].name + "  HP:" +
      Math.ceil(c.hp) + "/" + c.maxHp + (G.time < c.slowUntil ? " (chilled)" : "") +
      "   (click for lore)";
  }
  text(0, 23, l2.padEnd(COLS).slice(0, COLS), "#8aa87a");

  if (G.overlay === "help") drawHelp();
  else if (G.overlay === "inv") drawInventory();
  else if (G.overlay === "log") drawLog();
  else if (G.lore) drawLore();
  else if (G.menu) drawMenu();
}
// word-wrap a string to fit within `w` columns -- used by drawLore() so
// hand-written flavor text doesn't need manual line breaks
function wrapText(s, w) {
  const words = s.split(" ");
  const lines = [];
  let line = "";
  for (const word of words) {
    const next = line ? line + " " + word : word;
    if (next.length > w) { lines.push(line); line = word; }
    else line = next;
  }
  if (line) lines.push(line);
  return lines;
}
function drawLore() {
  const m = MONSTERS[G.lore];
  const w = 56;
  const bodyLines = wrapText(m.lore || "Not much is known about this creature.", w - 4);
  const h = bodyLines.length + 5;
  const x0 = Math.floor((MAPW - w) / 2);
  const y0 = Math.max(1, Math.min(20 - h, 8));
  overlayBox(x0, y0, w, h, m.ch + " " + m.name);
  let row = y0 + 2;
  const flags = [];
  if (m.flies) flags.push("flies");
  if (m.submerges) flags.push("submerges");
  if (m.splits) flags.push("splits");
  if (m.siege) flags.push("smashes towers");
  if (m.disarms) flags.push("disarms traps");
  if (m.regen) flags.push("fast regen");
  if (m.immuneTo) flags.push(m.immuneTo + "-immune");
  const stat = "hp:" + m.hp + "  spd:" + m.spd.toFixed(1) + "  bounty:" + m.bounty +
    (flags.length ? "  [" + flags.join(", ") + "]" : "");
  text(x0 + 2, row, stat, "#8aa87a");
  row += 2;
  bodyLines.forEach((l, i) => text(x0 + 2, row + i, l, "#c8e8b8"));
  text(x0 + 2, y0 + h - 1, "click or SPACE to close", "#6a8a6a");
}

function drawCentered(lines, y0, fg) {
  lines.forEach((s, i) => text(Math.floor((COLS - s.length) / 2), y0 + i, s, fg));
}
function overlayBox(x0, y0, w, h, title) {
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++)
    put(x, y, " ", "#4a7a4a", "#0a120a");
  if (title) text(x0 + 2, y0, title, "#e8e850");
}
// screen-space box for the tile-action menu, positioned near the tile it's
// for (below-right by default) but clamped to stay within the map rows
// (1..21, never over the status bar) and columns -- both drawMenu() and
// the mousedown click-hit-test use this SAME function, so they always
// agree on where the menu's option lines actually are
function menuBox(x, y, n) {
  const w = 36, h = n + 3;
  const sx = x, sy = MAPY + y;
  const bx0 = Math.max(0, Math.min(COLS - w, sx + 2));
  const by0 = Math.max(1, Math.min(22 - h, sy - 1));
  return { bx0, by0, w, h };
}
function drawMenu() {
  const { x, y } = G.menu;
  const { tower, opts, headerLines } = menuLayout(x, y);
  const { bx0, by0, w, h } = menuBox(x, y, Math.max(opts.length, 1) + headerLines);
  const title = tower ? TOWERS[tower.type].ch + " " + TOWERS[tower.type].name + " L" + tower.lvl
                       : "Build here";
  overlayBox(bx0, by0, w, h, title);
  let row = by0 + 2;
  if (tower) {
    const spec = TOWERS[tower.type];
    const durability = spec.siegeHp
      ? "  dur:" + Math.ceil(tower.siegeHp) + "/" + towerMaxSiegeHp(tower)
      : spec.trapHp ? "  dur:" + Math.ceil(tower.trapHp) + "/" + towerMaxTrapHp(tower) : "";
    const stat = spec.hp
      ? "hp:" + Math.ceil(tower.hp) + "/" + towerMaxHp(tower)
      : "dmg:" + towerDmg(tower) + "  rng:" + towerRange(tower).toFixed(1) +
        (spec.maxCharges ? "  chg:" + Math.floor(tower.charges) + "/" + towerMaxCharges(tower) : "") +
        durability;
    text(bx0 + 2, row, stat, "#8aa87a");
    row++;
  }
  if (!opts.length) {
    text(bx0 + 2, row, "Nothing can be built here.", "#8a8a6a");
  } else {
    opts.forEach((o, i) => text(bx0 + 2, row + i, "[" + o.key + "] " + o.label, "#c8e8b8"));
  }
  text(bx0 + 2, by0 + h - 1, "ESC to close", "#6a8a6a");
}
function drawHelp() {
  const x0 = 8, y0 = 1, w = 64, h = 21;
  overlayBox(x0, y0, w, h);
  const lines = [
    "--------------------- YATD Help ---------------------",
    "Click a tile (or ENTER on the cursor) for a menu of",
    "what to do there. Monsters route live, no fixed path.",
    " 1 / Archer            $18  bolts, limited arrows -- free from start",
    " 2 0 Acid Blob         $25  splash, blocks, LOS -- unlock $40",
    " 3 { Frost Fountain    $20  slows, blocks, LOS -- unlock $35",
    " 4 ^ Fire Trap         $15  ON the corridor #  -- unlock $30",
    " 5 \\ Wand of Lightning $30  arcs to 2 more     -- unlock $70",
    " 6 % Dirt Wall         $8   pure block, hp      -- unlock $15",
    "Enchant up to L" + MAX_LVL + " in the menu -- capped by Lv (kill XP).",
    "Each level's dragon resists a random element -- mix",
    "your damage types, one tower type won't always win.",
    "ITEMS: r fire  q haste  z cold  c charge  i inv",
    "KEYS: SPACE wave/pause  a auto  Ctrl-P log  R restart",
    "      hjkl/arrows+ENTER cursor  + - speed",
    "",
    "~30 monsters, phasing in/out by dungeon level. Some fly,",
    "submerge, split, regen fast, smash towers, or disarm",
    "traps -- click any monster to read its lore. D is always",
    "the wave-10 boss.",
  ];
  lines.forEach((s, i) => text(x0 + 2, y0 + i + 1, s, "#c8e8b8"));
}
const INV_BOX = { x0: 14, y0: 6, w: 52, h: 14 };
// items you're actually carrying, with the function each one's hotkey
// invokes -- used both to draw the inventory and, so you can act on an
// item directly from the inventory screen instead of having to close it
// and press the hotkey again, to dispatch a keypress/click while it's open
function invItems() {
  return [
    { ch: "?", name: "scroll of fireball", n: G.inv.scroll, key: "r", label: "read (aimed)",  action: beginScroll },
    { ch: "!", name: "potion of haste",    n: G.inv.potion, key: "q", label: "quaff",         action: usePotion },
    { ch: "/", name: "wand of cold",       n: G.inv.wand,   key: "z", label: "zap (aimed)",   action: beginWand },
    { ch: "/", name: "wand of charging",   n: G.inv.charge, key: "c", label: "use (charges every tower)", action: useCharge },
  ].filter(it => it.n > 0);
}
// invItems() plus the exact screen row each one's two lines land on --
// drawInventory() and mousedown's click-hit-test both derive their row
// math from this SAME function, same convention as the tile-action menu
function invLayout() {
  let row = INV_BOX.y0 + 2;
  const items = invItems().map(it => {
    const laid = { ...it, row0: row, row1: row + 1 };
    row += 2;
    return laid;
  });
  return items;
}
function drawInventory() {
  const { x0, y0, w, h } = INV_BOX;
  overlayBox(x0, y0, w, h);
  text(x0 + 2, y0, "----------------- Inventory -----------------", "#e8e850");
  const items = invLayout();
  if (!items.length) {
    text(x0 + 2, y0 + 2, "You are not carrying anything.", "#8aa87a");
  } else {
    for (const it of items) {
      text(x0 + 2, it.row0, it.ch + " - " + it.name + " (x" + it.n + ")", "#c8e8b8");
      text(x0 + 2, it.row1, "    [" + it.key + "] " + it.label, "#6a8a6a");
    }
  }
  text(x0 + 2, y0 + h - 2, "click a line or press its key to use it", "#6a8a6a");
  text(x0 + 2, y0 + h - 1, "i or ESC to close", "#6a8a6a");
}
function drawLog() {
  const x0 = 4, y0 = 1, w = 72, h = 20;
  overlayBox(x0, y0, w, h);
  text(x0 + 2, y0, "----------------- Message Log -----------------", "#e8e850");
  const rows = h - 4;
  const lines = G.log.slice(-rows);
  lines.forEach((s, i) => text(x0 + 2, y0 + 2 + i, s.slice(0, w - 4), "#9ac88a"));
  text(x0 + 2, y0 + h - 1, "Ctrl-P or ESC to close", "#6a8a6a");
}

function drawTitle() {
  clearBuf();
  drawMap();
  for (let y = 1; y < 22; y++) for (let x = 0; x < COLS; x++) {
    const c = buf[y][x]; if (c.ch !== " ") c.fg = "#1c3520";
  }
  drawCentered([
    "__   __ _  _____  ____",
    "\\ \\ / // \\|_   _||  _ \\",
    " \\ V // _ \\ | |  | | | |",
    "  | |/ ___ \\| |  | |_| |",
    "  |_/_/   \\_\\_|  |____/",
  ], 4, "#50ff96");
  drawCentered(["Y e t   A n o t h e r   T o w e r   D e f e n s e"], 11, "#c8e8b8");
  drawCentered(["a NetHack-flavored dungeon defense"], 13, "#6a8a6a");
  if (Math.floor(G.time * 1.5) % 2 === 0)
    drawCentered(["-- press any key to descend --"], 17, "#e8e850");
  drawCentered(["dungeon seed " + SEED + "  |  every game is a new dungeon"], 20, "#3a5a3a");
}
function drawWon() {
  drawGame();
  const y0 = 4;
  for (let y = y0; y < y0 + 13; y++) for (let x = 14; x < 66; x++)
    put(x, y, " ", "#4a7a4a", "#0a120a");
  drawCentered([
    "*  *  *  V I C T O R Y  *  *  *",
    "",
    "The last dragon falls.  The staircase crumbles behind it.",
    "You feel the dungeon's gratitude wash over you.",
    "",
    "You ascend to demigodhood, having cleared Dlvl " + G.dlvl + "...",
    "",
    "Final score: " + G.score + "   Kills: " + G.kills + "   HP left: " + G.hp,
    "",
    "-- press R to play again --",
  ], y0 + 1, "#e8e850");
}
function drawLost() {
  clearBuf();
  const dtext = "Dlvl " + G.dlvl + ", wave " + G.wave;
  const padL = Math.floor(Math.max(0, 18 - dtext.length) / 2);
  const padR = Math.max(0, 18 - dtext.length) - padL;
  drawCentered([
    "               ----------",
    "              /          \\",
    "             /    REST    \\",
    "            /      IN      \\",
    "           /     PEACE      \\",
    "          /                  \\",
    "          |     the Keeper   |",
    "          |    " + String(G.score).padStart(6) + " points   |",
    "          |   overrun by a   |",
    "          |   monster horde  |",
    "          |" + " ".repeat(padL) + dtext + " ".repeat(padR) + "|",
    "         *|     *  *  *      | *",
    " ________)/\\\\_//(\\/(/\\)/\\//\\/|_)_______",
  ], 3, "#a8b8a8");
  drawCentered(["Do you want your possessions identified? [ynq]  (q, obviously)"], 18, "#c8d8b8");
  drawCentered(["-- press R to try again --"], 20, "#e8e850");
}

/* ---------- input ---------- */
function cellFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  // clamp: a click on the exact right/bottom edge pixel can compute to
  // COLS/ROWS (one past the last valid index) and silently miss
  const x = Math.min(COLS - 1, Math.max(0, Math.floor((e.clientX - r.left) / r.width * COLS)));
  const y = Math.min(ROWS - 1, Math.max(0, Math.floor((e.clientY - r.top) / r.height * ROWS)));
  return [x, y - MAPY];
}
canvas.addEventListener("mousemove", (e) => {
  const [x, y] = cellFromEvent(e);
  G.hover.x = x; G.hover.y = y; G.cursor.on = false;
});
canvas.addEventListener("mousedown", (e) => {
  if (G.state === "title") { resetGame(); return; }
  if (G.state === "won" || G.state === "lost") return;
  const [x, y] = cellFromEvent(e);
  G.hover.x = x; G.hover.y = y;   // keep the range-preview in sync with the click
  if (y < 0 || y >= MAPH) return;

  // targeting (a scroll/wand being aimed) takes priority over everything
  // else -- a click anywhere on the map picks the impact point
  if (G.targeting) { resolveTargeting(x, y); return; }

  // a lore popup, like an overlay, absorbs the click that closes it
  // rather than also opening whatever's underneath
  if (G.lore) { setLore(null); return; }

  // clicking an item's row in the inventory screen uses it directly,
  // same as pressing its hotkey would -- clicking anywhere else in the
  // overlay still just closes it (falls through to toggleMenu() below)
  if (G.overlay === "inv") {
    const sx = x, sy = MAPY + y;
    const { x0, w } = INV_BOX;
    if (sx >= x0 && sx < x0 + w) {
      const item = invLayout().find(it => sy === it.row0 || sy === it.row1);
      if (item) { setOverlay(null); item.action(); return; }
    }
    setOverlay(null);
    return;
  }

  // clicking a tile with a live creep on it (and no tower -- a tower's
  // upgrade/sell menu takes priority, e.g. a flying creep sharing a
  // tower's cell) shows that monster's lore instead of the build menu a
  // creep-occupied buildable tile would otherwise show (which would just
  // read "Nothing can be built here" anyway, since occupied tiles aren't
  // buildable)
  if (!towerAt(x, y)) {
    const c = G.creeps.find(c => {
      const [cx, cy] = creepCell(c);
      return !c.dead && cx === x && cy === y;
    });
    if (c) { setLore(c.type); return; }
  }

  // a click inside the currently-open menu's box runs whichever option
  // line it landed on (or does nothing, if it hit the title/border/
  // footer rather than an option) -- either way it does NOT also
  // re-trigger the toggle-menu logic below
  if (G.menu) {
    const { opts, headerLines } = menuLayout(G.menu.x, G.menu.y);
    const box = menuBox(G.menu.x, G.menu.y, Math.max(opts.length, 1) + headerLines);
    const sx = x, sy = MAPY + y;
    if (sx >= box.bx0 && sx < box.bx0 + box.w && sy >= box.by0 && sy < box.by0 + box.h) {
      const lineIdx = sy - (box.by0 + 2 + headerLines);
      if (lineIdx >= 0 && lineIdx < opts.length) {
        const opt = opts[lineIdx];
        opt.action();
        if (!opt.keepOpen) setMenu(null);
      }
      return;
    }
  }
  toggleMenu(x, y);
});
// open the tile-action menu, or close it if it's already open for this
// exact tile (a second click/ENTER on the same spot toggles it closed)
function toggleMenu(x, y) {
  if (G.menu && G.menu.x === x && G.menu.y === y) { setMenu(null); return; }
  if (G.overlay) { setOverlay(null); return; }
  setMenu({ x, y });
}

const DIRS = {
  h: [-1, 0], j: [0, 1], k: [0, -1], l: [1, 0],
  ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1], ArrowRight: [1, 0],
  y: [-1, -1], u2: [1, -1], b: [-1, 1], n: [1, 1],
};
window.addEventListener("keydown", (e) => {
  if (e.key === " ") e.preventDefault();
  if (G.state === "title") { resetGame(); return; }
  if (G.state === "won" || G.state === "lost") {
    if (e.key === "r" || e.key === "R") resetGame();
    return;
  }
  // overlays (help / inventory / message log) toggle regardless of state,
  // and swallow every other key while one is open
  if (e.key === "?") { setOverlay(G.overlay === "help" ? null : "help"); return; }
  if (e.key === "i") { setOverlay(G.overlay === "inv" ? null : "inv"); return; }
  if (e.ctrlKey && e.key.toLowerCase() === "p") {
    e.preventDefault();
    setOverlay(G.overlay === "log" ? null : "log");
    return;
  }
  // the inventory screen lets you act on an item directly instead of
  // making you close it and press the hotkey again -- the whole point
  // of opening it is usually to decide what to use
  if (G.overlay === "inv") {
    if (e.key === "Escape" || e.key === " ") { setOverlay(null); return; }
    const item = invItems().find(it => it.key === e.key.toLowerCase());
    if (item) { setOverlay(null); item.action(); return; }
    return;
  }
  // SPACE closes an overlay too, not just Escape -- NetHack itself uses
  // SPACE to dismiss things (--More--), so it reads naturally here; the
  // menu/targeting arm below keep SPACE's other meanings (pause toggle,
  // wave start) since they're lightweight popups, not a modal overlay
  if (G.overlay) { if (e.key === "Escape" || e.key === " ") setOverlay(null); return; }

  // the monster lore popup (opened by clicking a creep) is a modal like
  // the overlays above, not a lightweight popup like the menu -- Escape
  // or SPACE dismiss it and swallow everything else
  if (G.lore) { if (e.key === "Escape" || e.key === " ") setLore(null); return; }

  // targeting (a scroll/wand being aimed): Escape cancels without
  // consuming the item, ENTER on the cursor confirms the impact point --
  // everything else (notably hjkl/arrows) falls through so the cursor
  // can still be moved to aim without a mouse
  if (G.targeting) {
    if (e.key === "Escape") {
      const kind = G.targeting.kind; setTargeting(null);
      message("You decide against it, for now.  (" + (kind === "scroll" ? "scroll" : "wand") + " unused)");
      return;
    }
    if (e.key === "Enter") { if (G.cursor.on) resolveTargeting(G.cursor.x, G.cursor.y); return; }
  }

  // the tile-action menu: Escape closes it, and any key matching one of
  // its currently-shown [key] options runs that action -- everything
  // else (hjkl, SPACE, item hotkeys...) falls through and keeps working,
  // unlike the overlays above, since the menu is a lightweight popup,
  // not a modal that should block the rest of the game
  if (G.menu) {
    if (e.key === "Escape") { setMenu(null); return; }
    const { opts } = menuOptions(G.menu.x, G.menu.y);
    const opt = opts.find(o => o.key.toLowerCase() === e.key.toLowerCase());
    if (opt) { opt.action(); if (!opt.keepOpen) setMenu(null); return; }
  }

  switch (e.key) {
    case " ":
      if ((G.menu || G.targeting || G.lore) && G.autoPaused) return; // pause state is governed by the open menu/targeting/lore, not SPACE
      if (G.state === "build") { startWave(); return; }
      if (G.state === "wave") {
        G.paused = !G.paused;
        message(G.paused ? "Time stands still.  (SPACE to resume)" : "Time flows once more.");
      }
      return;
    case "a": G.autoStart = !G.autoStart;
      message("Auto-start waves: " + (G.autoStart ? "on" : "off")); return;
    case "+": case "=": G.speed = Math.min(4, G.speed * 2);
      message("Game speed x" + G.speed); return;
    case "-": G.speed = Math.max(1, G.speed / 2);
      message("Game speed x" + G.speed); return;
    case "r": beginScroll(); return;
    case "q": usePotion(); return;
    case "z": beginWand(); return;
    case "c": useCharge(); return;
    case "R": resetGame(); return;
    case "Enter":
      if (G.cursor.on) toggleMenu(G.cursor.x, G.cursor.y);
      return;
  }
  const d = DIRS[e.key];
  if (d) {
    if (!G.cursor.on) {
      G.cursor.on = true;
      if (G.hover.y >= 0 && G.hover.y < MAPH) {
        G.cursor.x = G.hover.x; G.cursor.y = G.hover.y;
      }
    } else {
      G.cursor.x = Math.max(0, Math.min(MAPW - 1, G.cursor.x + d[0]));
      G.cursor.y = Math.max(0, Math.min(MAPH - 1, G.cursor.y + d[1]));
    }
  }
});

// hooks for automated testing. ENTRANCE/EXIT/flow are exposed as getters
// since the underlying `let` bindings are reassigned wholesale on every
// resetGame() -- a plain property here would go stale after the first game.
window.YATD = { buildTower, upgradeTower, sellTower, unlockTower, startWave, resetGame,
                buildable, trapPlaceable, towerAt, path, map,
                getEntrance: () => ENTRANCE, getExit: () => EXIT,
                getFlow: () => G.flow, getFlowFly: () => G.flowFly,
                wouldSealPath };

/* ---------- main loop ---------- */
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  let dt = Math.min(0.25, (now - last) / 1000);
  last = now;
  acc += dt * G.speed;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  if (G.state === "title") { G.time += dt; drawTitle(); }
  else if (G.state === "won") drawWon();
  else if (G.state === "lost") drawLost();
  else drawGame();
  blit();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
